<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSA BIMBEL - Smart Tutoring Management</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .nav-item.active { background-color: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; font-weight: 500;}
        .nav-item { transition: all 0.2s ease-in-out; }
        .nav-item:hover:not(.active) { background-color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- Admin Login -->
    <section id="login-screen" class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-50 p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
            <div class="flex flex-col items-center text-center mb-8">
                <div class="w-14 h-14 rounded-2xl bg-primary-50 text-primary-600 flex items-center justify-center mb-4">
                    <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Login Admin</h1>
                <p class="text-sm text-slate-500 mt-2">Masuk untuk mengakses dashboard LSA BIMBEL.</p>
            </div>
            <form id="login-form" onsubmit="submitAdminLogin(event)" class="space-y-5">
                <div>
                    <label for="admin-username" class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                    <input id="admin-username" name="username" type="text" autocomplete="username" required
                           class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100">
                </div>
                <div>
                    <label for="admin-password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                    <input id="admin-password" name="password" type="password" autocomplete="current-password" required
                           class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100">
                </div>
                <p id="login-error" class="hidden text-sm text-red-600" role="alert"></p>
                <button id="login-submit-button" type="submit"
                        class="w-full px-4 py-2.5 text-sm font-semibold text-white bg-primary-600 rounded-lg hover:bg-primary-700 disabled:opacity-60">
                    Masuk
                </button>
            </form>
            <p class="text-xs text-slate-400 text-center mt-6">Akses khusus Owner / Admin</p>
        </div>
    </section>

    <section id="public-attendance-screen" class="hidden fixed inset-0 z-[70] flex items-center justify-center bg-slate-50 p-4 overflow-y-auto">
        <div id="public-attendance-content" class="w-full max-w-lg bg-white rounded-2xl shadow-lg border border-slate-200 p-6"></div>
    </section>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="hidden flex flex-col bg-white w-64 border-r border-slate-200 h-full absolute md:relative z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 justify-between">
            <div class="flex items-center gap-2 text-primary-600">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                <span class="text-xl font-bold tracking-tight">LSA BIMBEL</span>
            </div>
            <button class="md:hidden text-slate-500" onclick="toggleSidebar()">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="p-4">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2">Menu Utama</p>
            <nav class="space-y-1" id="nav-menu">
                <!-- Navigation inserted by JS -->
            </nav>
        </div>
        
        <div class="mt-auto p-4 border-t border-slate-200">
            <div class="flex items-center gap-3 px-2 py-2">
                <div class="w-9 h-9 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center font-bold">
                    AD
                </div>
                <div>
                    <p class="text-sm font-medium">Admin Utama</p>
                    <p class="text-xs text-slate-500">Owner / Admin</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div id="app-shell" class="hidden flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-6 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-500 hover:text-slate-700" onclick="toggleSidebar()">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="relative hidden sm:block">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder="Cari siswa, kelas, jadwal..." class="pl-9 pr-4 py-2 bg-slate-100 border-transparent rounded-lg text-sm focus:bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none w-64 transition-all">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </button>
                <div class="h-8 w-px bg-slate-200"></div>
                <button type="button" onclick="logoutAdmin()" class="text-sm font-medium text-slate-600 hover:text-primary-600 flex items-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 relative">
            <!-- Content injected by JS -->
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-slate-800" id="modal-title">Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto" id="modal-body">
                <!-- Modal Body -->
            </div>
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3" id="modal-footer">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">Batal</button>
                <button id="modal-action-btn" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 shadow-sm">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Application Script -->
    <script>
        // --- Initial database used to seed the Google Sheets database ---
        const db = {
            students: [
                { id: 1, code: 'S-26001', name: 'Alya Putri', school: 'SMA Negeri 1', grade: '10', parentName: 'Bpk. Andi', phone: '081234567890', program: 'Privat', status: 'Aktif', monthlyFee: 0 },
                { id: 2, code: 'S-26002', name: 'Bima Sakti', school: 'SMP Negeri 3', grade: '8', parentName: 'Ibu Ratna', phone: '081987654321', program: 'Kelompok', status: 'Aktif', monthlyFee: 0 },
                { id: 3, code: 'S-26003', name: 'Citra Kirana', school: 'SD Taruna', grade: '5', parentName: 'Bpk. Budi', phone: '085612312312', program: 'Privat', status: 'Aktif', monthlyFee: 0 }
            ],
            tutors: [
                { id: 1, name: 'Bu Rina', subject: 'Matematika, IPA', phone: '08111222333', status: 'Aktif', education: 'S1 Pendidikan Matematika', feeRules: { type: 'Per Pertemuan', value: 50000 } },
                { id: 2, name: 'Pak Doni', subject: 'Bahasa Inggris', phone: '08222333444', status: 'Aktif', education: 'S1 Sastra Inggris', feeRules: { type: 'Persentase', value: 60 } }
            ],
            schedules: [
                { id: 1, date: '2026-11-11', startTime: '15:00', endTime: '16:30', tutorId: 1, studentIds: [1], subject: 'Matematika', type: 'Privat', status: 'Selesai', hasJournal: true },
                { id: 2, date: '2026-11-11', startTime: '16:30', endTime: '18:00', tutorId: 2, studentIds: [2], subject: 'Bahasa Inggris', type: 'Kelompok', status: 'Berjalan', hasJournal: false },
                { id: 3, date: '2026-11-12', startTime: '14:00', endTime: '15:30', tutorId: 1, studentIds: [3], subject: 'IPA', type: 'Privat', status: 'Dijadwalkan', hasJournal: false }
            ],
            journals: [
                { id: 1, scheduleId: 1, studentId: 1, tutorId: 1, material: 'Pecahan sederhana dan operasi hitung', mastery: 'Cukup memahami', notes: 'Alya sudah mampu memahami penjumlahan pecahan dengan penyebut sama. Perlu ditingkatkan untuk soal cerita dan pecahan dengan penyebut berbeda.', recommendation: 'Latihan 5 soal di rumah.', score: 85 }
            ],
            waReports: [
                { id: 1, journalId: 1, status: 'Menunggu Persetujuan' }
            ],
            invoices: [
                { id: 1, studentId: 1, invoiceNumber: 'INV-2611-001', amount: 500000, dueDate: '2026-11-10', status: 'Lunas' },
                { id: 2, studentId: 2, invoiceNumber: 'INV-2611-002', amount: 350000, dueDate: '2026-11-15', status: 'Belum Lunas' }
            ],
            tutorEarnings: [
                { id: 1, tutorId: 1, scheduleId: 1, amount: 50000, status: 'Pending', date: '2026-11-11' }
            ],
            payments: [],
            tutorPayments: []
        };

        // --- App State ---
        let currentState = {
            route: 'dashboard'
        };
        let saveQueue = Promise.resolve();
        let databaseVersion = 0;
        const DATABASE_API_URL = '/api';
        let selectedScheduleDate = getLocalDateString();
        let selectedFinanceMonth = getLocalDateString().slice(0, 7);
        let selectedWAReportId = null;
        let publicAttendanceToken = '';
        let publicAttendanceOptions = null;

        const routes = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'students', label: 'Data Siswa', icon: 'users' },
            { id: 'tutors', label: 'Data Tentor', icon: 'user-check' },
            { id: 'schedules', label: 'Jadwal & Presensi', icon: 'calendar-days' },
            { id: 'journals', label: 'Jurnal Belajar', icon: 'book-open' },
            { id: 'finance', label: 'Keuangan & Honor', icon: 'wallet' },
            { id: 'wa_reports', label: 'Laporan WhatsApp', icon: 'message-circle' }
        ];

        // --- Core UI Functions ---
        function initApp() {
            lucide.createIcons();
            const checkinToken = new URLSearchParams(window.location.search).get('checkin');
            if (checkinToken) {
                openPublicAttendance(checkinToken);
                return;
            }
            callDatabaseApi({ action: 'checkSession' })
                .then(() => openAdminApp())
                .catch(error => {
                    if (error.status === 401) {
                        showLoginScreen();
                    } else {
                        showLoginScreen(error.message || 'Gagal memeriksa sesi admin.');
                    }
                });
        }

        async function openPublicAttendance(token) {
            publicAttendanceToken = token;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('public-attendance-screen').classList.remove('hidden');
            const content = document.getElementById('public-attendance-content');
            content.innerHTML = '<div class="py-12 text-center text-slate-500">Memuat informasi sesi...</div>';
            try {
                publicAttendanceOptions = await callDatabaseApi({ action: 'getAttendanceOptions', token });
                const session = publicAttendanceOptions;
                const evaluationFields = session.students
                    .filter(student => student.checkedIn)
                    .map(student => `
                        <div>
                            <label for="attendance-evaluation-${escapeHtml(student.id)}" class="block text-sm font-medium text-slate-700 mb-1">Evaluasi ${escapeHtml(student.name)}</label>
                            <textarea id="attendance-evaluation-${escapeHtml(student.id)}" data-student-id="${escapeHtml(student.id)}" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Contoh: sudah paham pecahan, perlu latihan soal cerita"></textarea>
                        </div>
                    `).join('');
                content.innerHTML = `
                    <div class="text-center mb-6">
                        <div class="w-12 h-12 mx-auto rounded-xl bg-primary-50 text-primary-600 flex items-center justify-center mb-3">
                            <i data-lucide="calendar-check" class="w-6 h-6"></i>
                        </div>
                        <h1 class="text-xl font-bold text-slate-800">Presensi Sesi Les</h1>
                        <p class="text-sm text-slate-500 mt-1">${escapeHtml(session.subject)} · ${escapeHtml(formatScheduleDate(session.date))}</p>
                        <p class="text-sm text-slate-500">${escapeHtml(session.startTime)} - ${escapeHtml(session.endTime)} · Tentor ${escapeHtml(session.tutor.name)}</p>
                    </div>
                    <div id="public-attendance-feedback" class="hidden mb-4 rounded-lg p-3 text-sm" role="status"></div>
                    ${session.canCheckIn ? `
                        <form id="public-attendance-form" class="space-y-4">
                            <div>
                                <label for="attendance-role" class="block text-sm font-medium text-slate-700 mb-1">Saya adalah</label>
                                <select id="attendance-role" onchange="updatePublicAttendanceOptions()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="tutor">Tentor</option>
                                    <option value="student">Siswa</option>
                                </select>
                            </div>
                            <div>
                                <label for="attendance-person" class="block text-sm font-medium text-slate-700 mb-1">Pilih nama</label>
                                <select id="attendance-person" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white"></select>
                            </div>
                            <div>
                                <label for="attendance-action" class="block text-sm font-medium text-slate-700 mb-1">Presensi</label>
                                <select id="attendance-action" onchange="updatePublicAttendanceForm()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                    <option value="checkIn">Check-in / Jam masuk</option>
                                    <option value="checkOut">Check-out tentor / Jam pulang</option>
                                </select>
                            </div>
                            <div id="attendance-journal-fields" class="hidden space-y-3 rounded-lg border border-primary-200 bg-primary-50/50 p-4">
                                <h2 class="font-semibold text-slate-800">Jurnal wajib sebelum sesi selesai</h2>
                                <button type="button" onclick="refreshPublicAttendanceOptions()" class="text-xs text-primary-700 hover:underline">Muat ulang daftar siswa hadir</button>
                                <div>
                                    <label for="attendance-material" class="block text-sm font-medium text-slate-700 mb-1">Materi / bab yang diajarkan</label>
                                    <textarea id="attendance-material" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Ringkas materi yang dibahas"></textarea>
                                </div>
                                <div id="attendance-student-evaluations">${evaluationFields || '<p class="text-sm text-slate-600">Belum ada siswa yang check-in. Isi materi sesi sebelum check-out.</p>'}</div>
                            </div>
                            <p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 rounded-lg p-3">Token sesi ini dibagikan bersama. Pilih nama Anda dengan benar; token tidak memverifikasi identitas pemegangnya.</p>
                            <button id="attendance-submit" type="submit" class="w-full px-4 py-2.5 text-sm font-semibold text-white bg-primary-600 rounded-lg hover:bg-primary-700">Kirim Presensi</button>
                        </form>
                    ` : `
                        <div class="rounded-lg bg-amber-50 border border-amber-200 p-4 text-sm text-amber-800">${escapeHtml(session.message || 'Presensi sesi ini sudah ditutup.')}</div>
                    `}
                `;
                lucide.createIcons();
                if (session.canCheckIn) {
                    updatePublicAttendanceOptions();
                    document.getElementById('public-attendance-form').addEventListener('submit', submitPublicAttendance);
                }
            } catch (error) {
                content.innerHTML = '<div class="py-8 text-center"><h1 class="font-bold text-slate-800">Presensi tidak tersedia</h1><p id="public-attendance-error" class="text-sm text-red-600 mt-2"></p></div>';
                content.querySelector('#public-attendance-error').textContent =
                    error.message || 'Token sesi tidak valid atau koneksi sedang bermasalah.';
            }
        }

        function updatePublicAttendanceOptions() {
            const role = document.getElementById('attendance-role').value;
            const personSelect = document.getElementById('attendance-person');
            const actionSelect = document.getElementById('attendance-action');
            const participants = role === 'tutor'
                ? [publicAttendanceOptions.tutor]
                : publicAttendanceOptions.students;
            personSelect.innerHTML = participants.map(person =>
                `<option value="${person.id}">${escapeHtml(person.name)}</option>`
            ).join('');
            const checkOutOption = actionSelect.querySelector('option[value="checkOut"]');
            checkOutOption.disabled = role !== 'tutor';
            if (role !== 'tutor' && actionSelect.value === 'checkOut') actionSelect.value = 'checkIn';
            updatePublicAttendanceForm();
        }

        function updatePublicAttendanceForm() {
            const fields = document.getElementById('attendance-journal-fields');
            if (!fields) return;
            const needsJournal = document.getElementById('attendance-role').value === 'tutor' &&
                document.getElementById('attendance-action').value === 'checkOut';
            fields.classList.toggle('hidden', !needsJournal);
            fields.querySelectorAll('textarea[required], textarea[data-student-id]').forEach(input => {
                input.required = needsJournal;
            });
            if (needsJournal && fields.dataset.hasRefreshed !== 'true') {
                refreshPublicAttendanceOptions();
            } else if (!needsJournal) {
                fields.dataset.hasRefreshed = 'false';
            }
        }

        async function refreshPublicAttendanceOptions() {
            const fields = document.getElementById('attendance-journal-fields');
            const container = document.getElementById('attendance-student-evaluations');
            if (!fields || !container || fields.dataset.refreshing === 'true') return;
            fields.dataset.refreshing = 'true';
            const existingNotes = new Map(Array.from(container.querySelectorAll('textarea[data-student-id]'))
                .map(input => [String(input.dataset.studentId), input.value]));
            try {
                publicAttendanceOptions = await callDatabaseApi({
                    action: 'getAttendanceOptions',
                    token: publicAttendanceToken
                });
                const checkedInStudents = publicAttendanceOptions.students.filter(student => student.checkedIn);
                container.innerHTML = checkedInStudents.length
                    ? checkedInStudents.map(student => `
                        <div>
                            <label for="attendance-evaluation-${escapeHtml(student.id)}" class="block text-sm font-medium text-slate-700 mb-1">Evaluasi ${escapeHtml(student.name)}</label>
                            <textarea id="attendance-evaluation-${escapeHtml(student.id)}" data-student-id="${escapeHtml(student.id)}" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Contoh: sudah paham pecahan, perlu latihan soal cerita">${escapeHtml(existingNotes.get(String(student.id)) || '')}</textarea>
                        </div>
                    `).join('')
                    : '<p class="text-sm text-slate-600">Belum ada siswa yang check-in. Isi materi sesi sebelum check-out.</p>';
                fields.dataset.hasRefreshed = 'true';
                updatePublicAttendanceForm();
            } catch (error) {
                showToast(`Gagal memuat ulang presensi siswa: ${error.message || 'Periksa koneksi.'}`, 'error');
            } finally {
                fields.dataset.refreshing = 'false';
            }
        }

        async function submitPublicAttendance(event) {
            event.preventDefault();
            const participantType = document.getElementById('attendance-role').value;
            const attendanceAction = document.getElementById('attendance-action').value;
            let journal = null;
            if (participantType === 'tutor' && attendanceAction === 'checkOut') {
                const material = document.getElementById('attendance-material').value.trim();
                const evaluations = Array.from(document.querySelectorAll('#attendance-journal-fields textarea[data-student-id]'))
                    .map(input => ({ studentId: Number(input.dataset.studentId), notes: input.value.trim() }));
                if (!material || evaluations.some(evaluation => !evaluation.notes)) {
                    const feedback = document.getElementById('public-attendance-feedback');
                    feedback.textContent = 'Isi materi dan evaluasi semua siswa yang hadir sebelum sesi diakhiri.';
                    feedback.className = 'mb-4 rounded-lg p-3 text-sm bg-red-50 text-red-700 border border-red-200';
                    return;
                }
                journal = { material, evaluations };
            }
            const button = document.getElementById('attendance-submit');
            const feedback = document.getElementById('public-attendance-feedback');
            let sessionCompleted = false;
            button.disabled = true;
            button.textContent = 'Menyimpan...';
            try {
                const result = await callDatabaseApi({
                    action: 'recordAttendance',
                    token: publicAttendanceToken,
                    participantType,
                    participantId: Number(document.getElementById('attendance-person').value),
                    attendanceAction,
                    journal
                });
                feedback.textContent = result.message;
                feedback.className = 'mb-4 rounded-lg p-3 text-sm bg-green-50 text-green-700 border border-green-200';
                sessionCompleted = result.status === 'Selesai';
            } catch (error) {
                feedback.textContent = error.message || 'Presensi gagal disimpan.';
                feedback.className = 'mb-4 rounded-lg p-3 text-sm bg-red-50 text-red-700 border border-red-200';
            } finally {
                button.disabled = sessionCompleted;
                button.textContent = sessionCompleted ? 'Sesi selesai' : 'Kirim Presensi';
            }
        }

        function showLoginScreen(message) {
            document.getElementById('sidebar').classList.add('hidden');
            document.getElementById('app-shell').classList.add('hidden');
            document.getElementById('sidebar-overlay').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            const errorElement = document.getElementById('login-error');
            errorElement.textContent = message || '';
            errorElement.classList.toggle('hidden', !message);
        }

        function openAdminApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('sidebar').classList.remove('hidden');

        function loadAppDatabase() {
            return callDatabaseApi({ action: 'getDatabase' });
        }

        async function callDatabaseApi(payload) {
            const response = await fetch(DATABASE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'same-origin',
                body: JSON.stringify(payload)
            });
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error('Respons API tidak valid. Periksa konfigurasi Cloudflare.');
            }
            if (!response.ok || result.error) {
                const error = new Error(result.error || `Permintaan database gagal (HTTP ${response.status}).`);
                error.status = response.status;
                if (response.status === 401 &&
                    !['login', 'checkSession', 'logout'].includes(payload.action)) {
                    showLoginScreen('Sesi admin telah berakhir. Silakan login kembali.');
                }
                throw error;
            }
            return result;
        }

        function persistDatabase(successMessage) {
            const snapshot = JSON.parse(JSON.stringify(db));
            saveQueue = saveQueue.catch(() => {}).then(() =>
                callDatabaseApi({
                    action: 'saveDatabase',
                    data: snapshot,
                    expectedVersion: databaseVersion
                }).then(result => {
                    databaseVersion = result.version;
                    return result;
                })
            );
            return saveQueue.then(result => {
                if (successMessage) showToast(successMessage);
                return result;
            }).catch(error => {
                showToast(`Gagal menyimpan data: ${error.message || 'Periksa koneksi Cloudflare dan Google Apps Script.'}`, 'error');
                throw error;
            });
        }

        function saveDatabaseAfterChange(successMessage) {
            persistDatabase(successMessage).catch(() => {});
        }

        function getProfilePeriodRange(period, referenceDate = new Date()) {
            const today = getLocalDateString(referenceDate);
            const start = new Date(`${today}T12:00:00`);
            let end = new Date(start);
            let label = 'Hari ini';

            if (period === 'week') {
                const daysSinceMonday = (start.getDay() + 6) % 7;
                start.setDate(start.getDate() - daysSinceMonday);
                end = new Date(start);
                end.setDate(end.getDate() + 6);
                label = 'Minggu ini';
            } else if (period === 'month') {
                start.setDate(1);
                end = new Date(start.getFullYear(), start.getMonth() + 1, 0, 12);
                label = 'Bulan ini';
            }

            const startDate = getLocalDateString(start);
            const endDate = getLocalDateString(end);
            return {
                startDate,
                endDate,
                label: startDate === endDate
                    ? `${label} · ${formatScheduleDate(startDate)}`
                    : `${label} · ${formatScheduleDate(startDate)} – ${formatScheduleDate(endDate)}`
            };
        }

        function getTutorScheduleHonorEstimate(tutor, schedule, useAttendance = false) {
            const rule = tutor?.feeRules;
            if (!rule) return null;

            let amount = 0;
            if (rule.type === 'Persentase') {
                amount = Number(schedule.manualTutorFee);
            } else if (rule.type === 'Per Pertemuan') {
                amount = Number(rule.value);
            } else if (rule.type === 'Per Siswa') {
                const studentCount = useAttendance
                    ? (schedule.attendanceRecords || []).filter(record =>
                        record.participantType === 'student' && record.checkInAt
                    ).length
                    : (schedule.studentIds || []).length;
                amount = Number(rule.value) * studentCount;
            } else if (rule.type === 'Per Jam') {
                let durationMinutes = 0;
                const actualStart = schedule.actualStartAt ? new Date(schedule.actualStartAt).getTime() : 0;
                const actualEnd = schedule.actualEndAt ? new Date(schedule.actualEndAt).getTime() : 0;
                if (useAttendance && actualStart && actualEnd > actualStart) {
                    durationMinutes = (actualEnd - actualStart) / 60000;
                } else {
                    const [startHour, startMinute] = String(schedule.startTime || '').split(':').map(Number);
                    const [endHour, endMinute] = String(schedule.endTime || '').split(':').map(Number);
                    if (![startHour, startMinute, endHour, endMinute].every(Number.isFinite)) return null;
                    durationMinutes = endHour * 60 + endMinute - (startHour * 60 + startMinute);
                }
                amount = Number(rule.value) * durationMinutes / 60;
            } else {
                return null;
            }

            return Number.isSafeInteger(Math.round(amount)) && amount > 0
                ? Math.round(amount)
                : null;
        }

        function getTutorPeriodSummary(tutor, period) {
            const range = getProfilePeriodRange(period);
            const schedules = db.schedules
                .filter(schedule =>
                    String(schedule.tutorId) === String(tutor.id) &&
                    schedule.date >= range.startDate &&
                    schedule.date <= range.endDate
                )
                .sort((a, b) =>
                    String(a.date).localeCompare(String(b.date)) ||
                    String(a.startTime).localeCompare(String(b.startTime))
                );
            const activeSchedules = schedules.filter(schedule => schedule.status !== 'Batal');
            const completedSchedules = schedules.filter(schedule => schedule.status === 'Selesai');
            const upcomingSchedules = schedules.filter(schedule =>
                schedule.status === 'Dijadwalkan' || schedule.status === 'Berjalan'
            );
            const earningsBySchedule = new Map(
                db.tutorEarnings
                    .filter(earning => String(earning.tutorId) === String(tutor.id))
                    .map(earning => [String(earning.scheduleId), earning])
            );
            const completedEarnings = completedSchedules
                .map(schedule => earningsBySchedule.get(String(schedule.id)))
                .filter(Boolean);

            let completedAmount = 0;
            let unpricedCompletedCount = 0;
            let missingCompletedEarningCount = 0;
            completedSchedules.forEach(schedule => {
                const earning = earningsBySchedule.get(String(schedule.id));
                if (!earning) missingCompletedEarningCount++;
                const amount = earning
                    ? Number(earning.amount)
                    : getTutorScheduleHonorEstimate(tutor, schedule, true);
                if (Number.isSafeInteger(amount) && amount >= 0) completedAmount += amount;
                else unpricedCompletedCount++;
            });

            let upcomingEstimate = 0;
            let unpricedUpcomingCount = 0;
            upcomingSchedules.forEach(schedule => {
                const amount = getTutorScheduleHonorEstimate(tutor, schedule);
                if (amount == null) unpricedUpcomingCount++;
                else upcomingEstimate += amount;
            });

            const payments = db.tutorPayments
                .filter(payment =>
                    String(payment.tutorId) === String(tutor.id) &&
                    payment.date >= range.startDate &&
                    payment.date <= range.endDate
                )
                .sort((a, b) =>
                    String(b.date).localeCompare(String(a.date)) ||
                    Number(b.id) - Number(a.id)
                );

            return {
                range,
                schedules,
                activeSchedules,
                completedSchedules,
                upcomingSchedules,
                earningsBySchedule,
                completedAmount,
                paidAmount: completedEarnings.reduce((sum, earning) => sum + getEarningPaidAmount(earning), 0),
                dueAmount: completedEarnings.reduce((sum, earning) => sum + getEarningRemaining(earning), 0),
                upcomingEstimate,
                allSessionsEstimate: completedAmount + upcomingEstimate,
                unpricedCompletedCount,
                missingCompletedEarningCount,
                unpricedUpcomingCount,
                payments
            };
        }

        function getProfilePeriodMonths(range) {
            const months = [];
            const current = new Date(`${range.startDate}T12:00:00`);
            const end = new Date(`${range.endDate}T12:00:00`);
            current.setDate(1);
            while (current <= end) {
                months.push(`${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}`);
                current.setMonth(current.getMonth() + 1);
            }
            return months;
        }

        function getStudentPeriodSummary(student, period) {
            const range = getProfilePeriodRange(period);
            const schedules = db.schedules
                .filter(schedule =>
                    (schedule.studentIds || []).some(id => String(id) === String(student.id)) &&
                    schedule.date >= range.startDate &&
                    schedule.date <= range.endDate
                )
                .sort((a, b) =>
                    String(a.date).localeCompare(String(b.date)) ||
                    String(a.startTime).localeCompare(String(b.startTime))
                );
            const activeSchedules = schedules.filter(schedule => schedule.status !== 'Batal');
            const completedSchedules = schedules.filter(schedule => schedule.status === 'Selesai');
            const upcomingSchedules = schedules.filter(schedule =>
                schedule.status === 'Dijadwalkan' || schedule.status === 'Berjalan'
            );
            const months = getProfilePeriodMonths(range);
            const sessionMonths = new Set(activeSchedules.map(schedule => String(schedule.date || '').slice(0, 7)));
            const invoices = db.invoices.filter(invoice =>
                String(invoice.studentId) === String(student.id) &&
                months.includes(String(invoice.billingMonth || invoice.dueDate || '').slice(0, 7))
            );
            const invoiceIds = new Set(invoices.map(invoice => String(invoice.id)));
            const payments = db.payments
                .filter(payment => {
                    if (payment.invoiceId != null) return invoiceIds.has(String(payment.invoiceId));
                    return String(payment.studentId) === String(student.id) &&
                        months.includes(String(payment.date || '').slice(0, 7));
                })
                .sort((a, b) =>
                    String(b.date).localeCompare(String(a.date)) ||
                    Number(b.id) - Number(a.id)
                );
            const estimatedMonths = months
                .filter(month => sessionMonths.has(month) || invoices.some(invoice =>
                    String(invoice.billingMonth || invoice.dueDate || '').slice(0, 7) === month
                ))
                .map(month => {
                    const monthInvoices = invoices.filter(invoice =>
                        String(invoice.billingMonth || invoice.dueDate || '').slice(0, 7) === month
                    );
                    if (monthInvoices.length) {
                        return {
                            month,
                            amount: monthInvoices.reduce((sum, invoice) => sum + (Number(invoice.amount) || 0), 0),
                            billed: true
                        };
                    }
                    const monthlyFee = Number(student.monthlyFee);
                    return {
                        month,
                        amount: Number.isSafeInteger(monthlyFee) && monthlyFee > 0 ? monthlyFee : null,
                        billed: false
                    };
                });

            return {
                range,
                schedules,
                activeSchedules,
                completedSchedules,
                upcomingSchedules,
                invoices,
                payments,
                paidAmount: invoices.reduce((sum, invoice) => sum + getInvoicePaidAmount(invoice), 0),
                dueAmount: invoices.reduce((sum, invoice) => sum + getInvoiceRemaining(invoice), 0),
                estimatedAmount: estimatedMonths.reduce((sum, item) => sum + (item.amount || 0), 0),
                unpricedMonthCount: estimatedMonths.filter(item => item.amount == null).length,
                estimatedMonths
            };
        }

        function getWhatsAppPhone(phone) {
            let digits = String(phone || '').replace(/[^\d]/g, '');
            if (digits.startsWith('0')) digits = `62${digits.slice(1)}`;
            else if (digits.startsWith('8')) digits = `62${digits}`;
            return /^\d{8,15}$/.test(digits) ? digits : '';
        }

        function getWAReportJournals(report) {
            const journalIds = Array.isArray(report.journalIds)
                ? report.journalIds
                : report.journalId == null ? [] : [report.journalId];
            const linked = db.journals.filter(journal =>
                journalIds.some(id => String(id) === String(journal.id))
            );
            if (linked.length) return linked;
            return db.journals.filter(journal =>
                String(journal.studentId) === String(report.studentId) &&
                String(journal.date || db.schedules.find(schedule =>
                    String(schedule.id) === String(journal.scheduleId)
                )?.date || '') === String(report.date || report.reportDate || '')
            );
        }

        function getWAReportDate(report) {
            const journal = getWAReportJournals(report)[0];
            const schedule = journal && db.schedules.find(item =>
                String(item.id) === String(journal.scheduleId)
            );
            return report.date || report.reportDate || journal?.date || schedule?.date || '';
        }

        function buildDailyStudentWhatsAppMessage(report) {
            const journals = getWAReportJournals(report);
            const studentId = report.studentId != null ? report.studentId : journals[0]?.studentId;
            const student = db.students.find(item => String(item.id) === String(studentId));
            if (!student) return { student: null, message: '' };
            const date = getWAReportDate(report) || getLocalDateString();
            const schedules = db.schedules.filter(schedule =>
                schedule.date === date &&
                (schedule.studentIds || []).some(id => String(id) === String(student.id))
            ).sort((a, b) => String(a.startTime).localeCompare(String(b.startTime)));
            const sections = schedules.map(schedule => {
                const attendance = (Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : [])
                    .find(record => record.participantType === 'student' && String(record.participantId) === String(student.id));
                const journal = db.journals.find(item =>
                    String(item.scheduleId) === String(schedule.id) &&
                    String(item.studentId) === String(student.id)
                );
                const attendanceText = attendance?.checkInAt
                    ? `Hadir${attendance.checkInAt ? ` (masuk ${new Date(attendance.checkInAt).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })})` : ''}`
                    : schedule.status === 'Batal' ? 'Sesi dibatalkan'
                        : schedule.status === 'Selesai' ? 'Tidak tercatat hadir'
                            : 'Belum dilaksanakan';
                const tutor = db.tutors.find(item => String(item.id) === String(schedule.tutorId));
                const lines = [
                    `• ${schedule.subject || 'Sesi belajar'} (${schedule.startTime || '--:--'}-${schedule.endTime || '--:--'}) — ${attendanceText}`,
                    `  Tentor: ${tutor?.name || 'Tidak diketahui'}`
                ];
                const material = journal?.material || schedule.lessonMaterial;
                if (material) lines.push(`  Materi: ${material}`);
                if (journal?.notes) lines.push(`  Evaluasi: ${journal.notes}`);
                if (journal?.recommendation) lines.push(`  Latihan: ${journal.recommendation}`);
                return lines.join('\n');
            });
            const parentGreeting = student.parentName && student.parentName !== '-'
                ? `Bapak/Ibu ${student.parentName}`
                : 'Bapak/Ibu Wali';
            const message = [
                `Assalamu'alaikum ${parentGreeting},`,
                '',
                `Berikut rekap kehadiran dan belajar ${student.name} pada ${formatScheduleDate(date)}:`,
                ...(sections.length ? sections : ['Belum ada sesi pada tanggal ini.']),
                '',
                'Terima kasih atas kepercayaan Bapak/Ibu kepada LSA BIMBEL.'
            ].join('\n');
            return { student, message };
        }

        function getSelectedWAReport() {
            const selected = db.waReports.find(report => String(report.id) === String(selectedWAReportId));
            const report = selected || db.waReports.find(item => item.status !== 'Terkirim') || db.waReports[0] || null;
            if (report) selectedWAReportId = report.id;

        function sendWAReport(reportId) {
            const report = db.waReports.find(item => String(item.id) === String(reportId));
            if (!report) {
                showToast('Draft laporan tidak ditemukan.', 'error');
                return;
            }
            const { student, message } = buildDailyStudentWhatsAppMessage(report);
            const phone = student && getWhatsAppPhone(student.phone);
            if (!phone) {
                showToast('Nomor WhatsApp wali tidak valid. Perbarui data siswa terlebih dahulu.', 'error');
                return;
            }
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            const chatWindow = window.open(url, '_blank');
            if (!chatWindow) {

            saveDatabaseAfterChange('Laporan ditandai sudah dikirim.');
            navigate('wa_reports');

        function renderFinance() {

                .filter(payment => payment.date === today)
                .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
            const totalExpensesToday = db.tutorPayments
                .filter(payment => payment.date === today)
                .reduce((sum, payment) => sum + Number(payment.amount || 0), 0);
            const unpaidAmount = db.invoices.reduce((sum, invoice) => sum + getInvoiceRemaining(invoice), 0);
            const pendingHonor = db.tutorEarnings.reduce((sum, earning) => sum + getEarningRemaining(earning), 0);
            const completedMonthSchedules = db.schedules.filter(schedule =>
                schedule.status === 'Selesai' && String(schedule.date || '').slice(0, 7) === selectedFinanceMonth
            );
            const monthTutorEarnings = db.tutorEarnings.filter(earning =>
                String(earning.date || '').slice(0, 7) === selectedFinanceMonth
            );
            const tutorHonorMap = {};
            db.tutors.forEach(tutor => {
                const earnings = monthTutorEarnings.filter(earning => String(earning.tutorId) === String(tutor.id));
                tutorHonorMap[tutor.id] = {
                    totalSesi: completedMonthSchedules.filter(schedule => String(schedule.tutorId) === String(tutor.id)).length,
                    totalHonor: earnings.reduce((sum, earning) => sum + (Number(earning.amount) || 0), 0),
                    paidHonor: earnings.reduce((sum, earning) => sum + getEarningPaidAmount(earning), 0),
                    pendingHonor: earnings.reduce((sum, earning) => sum + getEarningRemaining(earning), 0)
                };

            const studentMonthSummary = db.students.filter(student => student.status === 'Aktif').map(student => {
                const sessions = completedMonthSchedules.filter(schedule =>
                    (schedule.studentIds || []).some(id => String(id) === String(student.id))

                const attendedSessions = sessions.filter(schedule =>
                    (Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : []).some(record =>
                        record.participantType === 'student' &&
                        String(record.participantId) === String(student.id) &&
                        record.checkInAt

                    String(item.studentId) === String(student.id) &&

        // --- Finance Helpers ---
        function getLocalDateString(date = new Date()) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function updateFinanceMonth(month) {
            if (!/^\d{4}-\d{2}$/.test(month)) {
                showToast('Bulan rekap tidak valid.', 'error');
                return;
            }
            selectedFinanceMonth = month;
            navigate('finance');
        }

        function formatRupiah(amount) {
            return `Rp ${Math.max(0, Math.round(Number(amount) || 0)).toLocaleString('id-ID')}`;
        }

        function nextRecordId(records) {
            return records.reduce((maxId, record) => Math.max(maxId, Number(record.id) || 0), 0) + 1;
        }

        function createReceiptNumber(prefix, id) {
            return `${prefix}-${getLocalDateString().replace(/-/g, '')}-${String(id).padStart(4, '0')}`;
        }

        function getInvoicePaidAmount(invoice) {
            const amount = Math.max(0, Number(invoice.amount) || 0);
            if (invoice.paidAmount !== undefined && Number.isFinite(Number(invoice.paidAmount))) {
                return Math.min(amount, Math.max(0, Number(invoice.paidAmount)));
            }
            return invoice.status === 'Lunas' ? amount : 0;
        }

        function getInvoiceRemaining(invoice) {
            return Math.max(0, (Number(invoice.amount) || 0) - getInvoicePaidAmount(invoice));
        }

        function getEarningPaidAmount(earning) {
            const amount = Math.max(0, Number(earning.amount) || 0);
            if (earning.paidAmount !== undefined && Number.isFinite(Number(earning.paidAmount))) {
                return Math.min(amount, Math.max(0, Number(earning.paidAmount)));
            }
            return earning.status === 'Paid' || earning.status === 'Lunas' ? amount : 0;
        }

        function getEarningRemaining(earning) {
            return Math.max(0, (Number(earning.amount) || 0) - getEarningPaidAmount(earning));
        }

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, character => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[character]);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'info';
            let bgColor = 'bg-blue-600';
            if (type === 'success') {
                icon = 'check-circle';
                bgColor = 'bg-slate-800';
            } else if (type === 'error') {
                icon = 'alert-circle';
                bgColor = 'bg-red-600';
            }
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 ${bgColor}`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            // Animate in
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            
            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function deleteStudent(studentId) {
            const student = db.students.find(item => String(item.id) === String(studentId));
            if (!student) {
                showToast('Data siswa tidak ditemukan.', 'error');
                return;
            }

            const linkedSchedules = db.schedules.filter(schedule =>
                (schedule.studentIds || []).some(id => String(id) === String(student.id)) ||
                (schedule.attendanceRecords || []).some(record =>
                    record.participantType === 'student' && String(record.participantId) === String(student.id)
                )
            );
            const exclusiveScheduleIds = new Set(linkedSchedules
                .filter(schedule => !(schedule.studentIds || []).some(id => String(id) !== String(student.id)))
                .map(schedule => String(schedule.id)));
            const relatedEarningIds = new Set(db.tutorEarnings
                .filter(earning => exclusiveScheduleIds.has(String(earning.scheduleId)))
                .map(earning => String(earning.id)));
            const relatedInvoices = db.invoices.filter(invoice => String(invoice.studentId) === String(student.id));
            const relatedInvoiceIds = new Set(relatedInvoices.map(invoice => String(invoice.id)));
            const relatedJournalIds = new Set(db.journals
                .filter(journal => String(journal.studentId) === String(student.id))
                .map(journal => String(journal.id)));
            const sharedScheduleCount = linkedSchedules.filter(schedule => !exclusiveScheduleIds.has(String(schedule.id))).length;

            const confirmation = [
                `Hapus permanen data siswa ${student.name}? Tindakan ini tidak dapat dibatalkan.`,
                `Data tagihan, pembayaran siswa, jurnal, laporan WhatsApp, presensi, dan sesi khusus siswa beserta honor sesi terkait akan dihapus.`,
                sharedScheduleCount
                    ? `${sharedScheduleCount} jadwal bersama akan tetap ada untuk siswa lain; siswa ini dan presensinya akan dilepas.`
                    : '',
                relatedEarningIds.size
                    ? 'Transaksi pengeluaran tentor yang sudah terjadi tetap tercatat, tetapi alokasinya ke honor sesi yang dihapus akan dilepas.'
                    : ''
            ].filter(Boolean).join('\n\n');
            if (!window.confirm(confirmation)) return;

            const snapshot = JSON.parse(JSON.stringify(db));
            const previousSelectedWAReportId = selectedWAReportId;
            const linkedScheduleIds = new Set(linkedSchedules.map(schedule => String(schedule.id)));
            const removedScheduleIds = new Set(linkedSchedules
                .filter(schedule => exclusiveScheduleIds.has(String(schedule.id)))
                .map(schedule => String(schedule.id)));
            const studentJournalIds = new Set([...relatedJournalIds]);

            db.schedules = db.schedules
                .filter(schedule => !removedScheduleIds.has(String(schedule.id)))
                .map(schedule => {
                    if (!linkedScheduleIds.has(String(schedule.id))) return schedule;
                    const studentIds = (schedule.studentIds || [])
                        .filter(id => String(id) !== String(student.id));
                    const attendanceRecords = (schedule.attendanceRecords || []).filter(record =>
                        !(record.participantType === 'student' && String(record.participantId) === String(student.id))
                    );
                    const hasJournal = db.journals.some(journal =>
                        String(journal.scheduleId) === String(schedule.id) &&
                        String(journal.studentId) !== String(student.id)
                    );
                    return { ...schedule, studentIds, attendanceRecords, hasJournal };
                });
            db.journals = db.journals.filter(journal => String(journal.studentId) !== String(student.id));
            db.waReports = db.waReports.flatMap(report => {
                if (String(report.studentId) === String(student.id)) return [];
                const journalIds = Array.isArray(report.journalIds)
                    ? report.journalIds
                    : report.journalId == null ? [] : [report.journalId];
                const remainingJournalIds = journalIds.filter(id => !studentJournalIds.has(String(id)));
                if (remainingJournalIds.length === journalIds.length) return [report];
                if (!remainingJournalIds.length) return [];
                return [{
                    ...report,
                    journalIds: remainingJournalIds,
                    journalId: remainingJournalIds[0]
                }];
            });
            db.invoices = db.invoices.filter(invoice => String(invoice.studentId) !== String(student.id));
            db.payments = db.payments.filter(payment =>
                String(payment.studentId) !== String(student.id) &&
                !relatedInvoiceIds.has(String(payment.invoiceId))
            );
            db.tutorEarnings = db.tutorEarnings.filter(earning =>
                !exclusiveScheduleIds.has(String(earning.scheduleId))
            );
            db.tutorPayments = db.tutorPayments.map(payment => ({
                ...payment,
                allocations: (payment.allocations || []).filter(allocation =>
                    !relatedEarningIds.has(String(allocation.earningId))
                )
            }));
            db.students = db.students.filter(item => String(item.id) !== String(student.id));
            if (!db.waReports.some(report => String(report.id) === String(selectedWAReportId))) {
                selectedWAReportId = null;
            }

            persistDatabase(`Data siswa ${student.name} dan data terkait berhasil dihapus.`)
                .then(() => {
                    if (currentState.route === 'students') navigate('students');
                })
                .catch(() => {
                    Object.keys(db).forEach(key => delete db[key]);
                    Object.assign(db, snapshot);
                    selectedWAReportId = previousSelectedWAReportId;
                    if (currentState.route === 'students') navigate('students');
                });
        }

        function deleteTutor(tutorId) {
            const tutor = db.tutors.find(item => String(item.id) === String(tutorId));
            if (!tutor) {
                showToast('Data tentor tidak ditemukan.', 'error');
                return;
            }

            const relatedSchedules = db.schedules.filter(schedule =>
                String(schedule.tutorId) === String(tutor.id)
            );
            const relatedScheduleIds = new Set(relatedSchedules.map(schedule => String(schedule.id)));
            const relatedEarnings = db.tutorEarnings.filter(earning =>
                String(earning.tutorId) === String(tutor.id) ||
                relatedScheduleIds.has(String(earning.scheduleId))
            );
            const relatedEarningIds = new Set(relatedEarnings.map(earning => String(earning.id)));
            const relatedJournals = db.journals.filter(journal =>
                String(journal.tutorId) === String(tutor.id) ||
                relatedScheduleIds.has(String(journal.scheduleId))
            );
            const relatedJournalIds = new Set(relatedJournals.map(journal => String(journal.id)));
            const payoutCount = db.tutorPayments.filter(payment =>
                String(payment.tutorId) === String(tutor.id)
            ).length;
            const confirmation = [
                `Hapus permanen data tentor ${tutor.name}? Tindakan ini tidak dapat dibatalkan.`,
                `${relatedSchedules.length} jadwal/presensi, ${relatedJournals.length} jurnal, dan ${relatedEarnings.length} catatan honor terkait akan dihapus.`,
                payoutCount
                    ? `${payoutCount} transaksi pengeluaran yang sudah terjadi tetap tersimpan; alokasi ke catatan honor yang dihapus akan dilepas.`
                    : ''
            ].filter(Boolean).join('\n\n');
            if (!window.confirm(confirmation)) return;

            const snapshot = JSON.parse(JSON.stringify(db));
            const previousSelectedWAReportId = selectedWAReportId;
            db.schedules = db.schedules.filter(schedule =>
                !relatedScheduleIds.has(String(schedule.id))
            );
            db.journals = db.journals.filter(journal =>
                !relatedJournalIds.has(String(journal.id))
            );
            db.waReports = db.waReports.flatMap(report => {
                const journalIds = Array.isArray(report.journalIds) ? [...report.journalIds] : [];
                if (report.journalId != null &&
                    !journalIds.some(id => String(id) === String(report.journalId))) {
                    journalIds.push(report.journalId);
                }
                const remainingJournalIds = journalIds.filter(id =>
                    !relatedJournalIds.has(String(id))
                );
                if (remainingJournalIds.length === journalIds.length) return [report];
                if (!remainingJournalIds.length) return [];
                return [{
                    ...report,
                    journalIds: remainingJournalIds,
                    journalId: remainingJournalIds[0]
                }];
            });
            db.tutorEarnings = db.tutorEarnings.filter(earning =>
                !relatedEarningIds.has(String(earning.id))
            );
            db.tutorPayments = db.tutorPayments.map(payment => ({
                ...payment,
                allocations: (payment.allocations || []).filter(allocation =>
                    !relatedEarningIds.has(String(allocation.earningId))
                )
            }));
            db.tutors = db.tutors.filter(item => String(item.id) !== String(tutor.id));
            if (!db.waReports.some(report => String(report.id) === String(selectedWAReportId))) {
                selectedWAReportId = null;
            }

            persistDatabase(`Data tentor ${tutor.name} beserta data terkait berhasil dihapus.`)
                .then(() => {
                    if (currentState.route === 'tutors') navigate('tutors');
                })
                .catch(() => {
                    Object.keys(db).forEach(key => delete db[key]);
                    Object.assign(db, snapshot);
                    selectedWAReportId = previousSelectedWAReportId;
                    if (currentState.route === 'tutors') navigate('tutors');
                });
        }

        function formatScheduleDate(date) {
            if (!date) return '';
            return new Intl.DateTimeFormat('id-ID', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            }).format(new Date(`${date}T12:00:00`));
        }

        function changeScheduleDate(days) {
            const date = new Date(`${selectedScheduleDate}T12:00:00`);
            date.setDate(date.getDate() + days);

        }

        function getScheduleDates(startDate, repeatUntil, weekdays) {
            if (!startDate) return { dates: [], error: 'Tanggal jadwal wajib diisi.' };
            if (!repeatUntil) return { dates: [startDate], error: '' };
            if (!weekdays.length) return { dates: [], error: 'Pilih minimal satu hari untuk jadwal rutin.' };

            const startParts = startDate.split('-').map(Number);
            const endParts = repeatUntil.split('-').map(Number);
            const startOrdinal = Date.UTC(startParts[0], startParts[1] - 1, startParts[2]);
            const endOrdinal = Date.UTC(endParts[0], endParts[1] - 1, endParts[2]);
            const dayCount = Math.floor((endOrdinal - startOrdinal) / 86400000);
            if (dayCount < 0) return { dates: [], error: 'Tanggal akhir rutin tidak boleh sebelum tanggal mulai.' };
            if (dayCount > 366) return { dates: [], error: 'Jadwal rutin dibatasi maksimal satu tahun.' };

            const selectedWeekdays = new Set(weekdays.map(Number));
            const dates = [];
            for (let offset = 0; offset <= dayCount; offset++) {
                const date = new Date(startOrdinal + offset * 86400000);
                if (selectedWeekdays.has(date.getUTCDay())) dates.push(date.toISOString().slice(0, 10));
            }
            return dates.length
                ? { dates, error: '' }
                : { dates: [], error: 'Tidak ada tanggal yang cocok dengan hari rutin yang dipilih.' };
        }

        function buildScheduleCandidates(values) {
            const generated = getScheduleDates(values.date, values.repeatUntil, values.weekdays);
            if (generated.error) return generated;
            if (!values.startTime || !values.endTime || values.endTime <= values.startTime) {
                return { dates: [], error: 'Jam selesai harus setelah jam mulai.' };
            }
            return {
                dates: generated.dates.map(date => ({
                    date,
                    startTime: values.startTime,
                    endTime: values.endTime,
                    tutorId: values.tutorId,
                    studentIds: [values.studentId],
                    room: values.room,
                    subject: values.subject,
                    type: values.type
                })),
                error: ''
            };
        }

        function getScheduleConflicts(candidates, excludedScheduleId) {
            const conflicts = [];
            const existing = db.schedules.filter(schedule =>
                schedule.status !== 'Batal' && String(schedule.id) !== String(excludedScheduleId)
            );
            candidates.forEach(candidate => {
                existing.forEach(schedule => {
                    if (candidate.date !== schedule.date ||
                        !schedule.startTime || !schedule.endTime ||
                        candidate.startTime >= schedule.endTime ||
                        candidate.endTime <= schedule.startTime) return;

                    const reasons = [];
                    if (String(candidate.tutorId) === String(schedule.tutorId)) {
                        const tutor = db.tutors.find(item => String(item.id) === String(schedule.tutorId));
                        reasons.push(`tentor ${tutor ? tutor.name : schedule.tutorId}`);
                    }
                    const studentIds = (candidate.studentIds || []).filter(id =>
                        (schedule.studentIds || []).some(existingId => String(existingId) === String(id))
                    );
                    studentIds.forEach(id => {
                        const student = db.students.find(item => String(item.id) === String(id));
                        reasons.push(`siswa ${student ? student.name : id}`);
                    });
                    const candidateRoom = String(candidate.room || '').trim().toLocaleLowerCase('id-ID');
                    const existingRoom = String(schedule.room || '').trim().toLocaleLowerCase('id-ID');
                    if (candidateRoom && existingRoom && candidateRoom === existingRoom) {
                        reasons.push(`ruang ${candidate.room}`);
                    }
                    if (reasons.length) {
                        conflicts.push(`${formatScheduleDate(candidate.date)} ${candidate.startTime}-${candidate.endTime}: bentrok dengan jadwal ${schedule.subject} (${reasons.join(', ')}).`);
                    }
                });
            });
            return [...new Set(conflicts)];
        }

            const conflicts = getScheduleConflicts(generated.dates);

                ? `Peringatan bentrok jadwal:\\n${conflicts.join('\\n')}`

            warning.className = conflicts.length
                ? 'rounded-lg border border-red-300 bg-red-50 p-3 text-sm text-red-700 whitespace-pre-line'
                : 'rounded-lg border border-green-200 bg-green-50 p-3 text-sm text-green-700 whitespace-pre-line';

            if (!window.crypto || !window.crypto.getRandomValues) {

            const bytes = new Uint8Array(24);
            window.crypto.getRandomValues(bytes);
            return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
