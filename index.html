<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSA BIMBEL - Smart Tutoring mManagement</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .nav-item.active { background-color: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; font-weight: 500;}
        .nav-item { transition: all 0.2s ease-in-out; }
        .nav-item:hover:not(.active) { background-color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white w-64 border-r border-slate-200 flex flex-col h-full absolute md:relative z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
        <div class="h-16 flex items-center px-6 border-b border-slate-200 justify-between">
            <div class="flex items-center gap-2 text-primary-600">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                <span class="text-xl font-bold tracking-tight">LSA BIMBEL</span>
            </div>
            <button class="md:hidden text-slate-500" onclick="toggleSidebar()">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="p-4">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2">Menu Utama</p>
            <nav class="space-y-1" id="nav-menu">
                <!-- Navigation inserted by JS -->
            </nav>
        </div>
        
        <div class="mt-auto p-4 border-t border-slate-200">
            <div class="flex items-center gap-3 px-2 py-2">
                <div class="w-9 h-9 rounded-full bg-primary-100 text-primary-600 flex items-center justify-center font-bold">
                    AD
                </div>
                <div>
                    <p class="text-sm font-medium">Admin Utama</p>
                    <p class="text-xs text-slate-500">Owner / Admin</p>

            </div>

    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 md:px-6 z-10">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-slate-500 hover:text-slate-700" onclick="toggleSidebar()">
                    <i data-lucide="menu" class="w-6 h-6"></i>
                </button>
                <div class="relative hidden sm:block">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" placeholder="Cari siswa, kelas, jadwal..." class="pl-9 pr-4 py-2 bg-slate-100 border-transparent rounded-lg text-sm focus:bg-white focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none w-64 transition-all">
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button class="relative p-2 text-slate-500 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                </button>

                    <span class="hidden sm:inline">Keluar</span>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 bg-slate-50 relative">
            <!-- Content injected by JS -->
        </main>
    </div>

    <!-- Modal Container -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/40 z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform scale-95 transition-transform duration-200" id="modal-content">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-slate-800" id="modal-title">Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="p-6 max-h-[70vh] overflow-y-auto" id="modal-body">
                <!-- Modal Body -->
            </div>
            <div class="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3" id="modal-footer">
                <button onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50">Batal</button>
                <button id="modal-action-btn" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 shadow-sm">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- Application Script -->
    <script>
        // --- Initial database used to seed the Google Sheets database ---
        const db = {
            students: [
                { id: 1, code: 'S-26001', name: 'Alya Putri', school: 'SMA Negeri 1', grade: '10', parentName: 'Bpk. Andi', phone: '081234567890', program: 'Privat', status: 'Aktif' },
                { id: 2, code: 'S-26002', name: 'Bima Sakti', school: 'SMP Negeri 3', grade: '8', parentName: 'Ibu Ratna', phone: '081987654321', program: 'Kelompok', status: 'Aktif' },
                { id: 3, code: 'S-26003', name: 'Citra Kirana', school: 'SD Taruna', grade: '5', parentName: 'Bpk. Budi', phone: '085612312312', program: 'Privat', status: 'Aktif' }
            ],
            tutors: [
                { id: 1, name: 'Bu Rina', subject: 'Matematika, IPA', phone: '08111222333', status: 'Aktif', education: 'S1 Pendidikan Matematika', feeRules: { type: 'Per Pertemuan', value: 50000 } },
                { id: 2, name: 'Pak Doni', subject: 'Bahasa Inggris', phone: '08222333444', status: 'Aktif', education: 'S1 Sastra Inggris', feeRules: { type: 'Persentase', value: 60 } }
            ],
            schedules: [
                { id: 1, date: '2026-11-11', startTime: '15:00', endTime: '16:30', tutorId: 1, studentIds: [1], subject: 'Matematika', type: 'Privat', status: 'Selesai', hasJournal: true },
                { id: 2, date: '2026-11-11', startTime: '16:30', endTime: '18:00', tutorId: 2, studentIds: [2], subject: 'Bahasa Inggris', type: 'Kelompok', status: 'Berjalan', hasJournal: false },
                { id: 3, date: '2026-11-12', startTime: '14:00', endTime: '15:30', tutorId: 1, studentIds: [3], subject: 'IPA', type: 'Privat', status: 'Dijadwalkan', hasJournal: false }
            ],
            journals: [
                { id: 1, scheduleId: 1, studentId: 1, tutorId: 1, material: 'Pecahan sederhana dan operasi hitung', mastery: 'Cukup memahami', notes: 'Alya sudah mampu memahami penjumlahan pecahan dengan penyebut sama. Perlu ditingkatkan untuk soal cerita dan pecahan dengan penyebut berbeda.', recommendation: 'Latihan 5 soal di rumah.', score: 85 }
            ],
            waReports: [
                { id: 1, journalId: 1, status: 'Menunggu Persetujuan' }
            ],
            invoices: [
                { id: 1, studentId: 1, invoiceNumber: 'INV-2611-001', amount: 500000, dueDate: '2026-11-10', status: 'Lunas' },
                { id: 2, studentId: 2, invoiceNumber: 'INV-2611-002', amount: 350000, dueDate: '2026-11-15', status: 'Belum Lunas' }
            ],
            tutorEarnings: [
                { id: 1, tutorId: 1, scheduleId: 1, amount: 50000, status: 'Pending', date: '2026-11-11' }
            ]
        };

        // --- App State ---
        let currentState = {
            route: 'dashboard'
        };
        let saveQueue = Promise.resolve();
        let databaseVersion = 0;
        const DATABASE_API_URL = '/api';

        const routes = [
            { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard' },
            { id: 'students', label: 'Data Siswa', icon: 'users' },
            { id: 'tutors', label: 'Data Tentor', icon: 'user-check' },
            { id: 'schedules', label: 'Jadwal & Presensi', icon: 'calendar-days' },
            { id: 'journals', label: 'Jurnal Belajar', icon: 'book-open' },
            { id: 'finance', label: 'Keuangan & Honor', icon: 'wallet' },
            { id: 'wa_reports', label: 'Laporan WhatsApp', icon: 'message-circle' }
        ];

        // --- Core UI Functions ---
        function initApp() {
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '<div class="flex justify-center items-center h-full"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-primary-500"></i></div>';
            lucide.createIcons();
            loadAppDatabase()
                .then(result => {
                    databaseVersion = result.version;
                    if (result.database) {
                        Object.keys(db).forEach(key => {
                            db[key] = result.database[key];
                        });
                    } else {
                        return persistDatabase();
                    }
                })
                .then(() => {
                    renderNavigation();
                    navigate(currentState.route);
                    lucide.createIcons();
                })
                .catch(error => {
                    mainContent.innerHTML = `
                        <div class="max-w-2xl mx-auto mt-12 bg-red-50 border border-red-200 rounded-xl p-6 text-red-800">
                            <h1 class="text-lg font-bold mb-2">Gagal memuat database</h1>
                            <p class="text-sm">${error.message || 'Periksa konfigurasi Cloudflare dan Google Apps Script, lalu muat ulang halaman.'}</p>
                        </div>
                    `;
                });
        }

        function loadAppDatabase() {
            return callDatabaseApi({ action: 'getDatabase' });
        }

        async function callDatabaseApi(payload) {
            const response = await fetch(DATABASE_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok || result.error) {
                throw new Error(result.error || `Permintaan database gagal (HTTP ${response.status}).`);
            }
            return result;
        }

        function persistDatabase(successMessage) {
            const snapshot = JSON.parse(JSON.stringify(db));
            saveQueue = saveQueue.catch(() => {}).then(() =>
                callDatabaseApi({
                    action: 'saveDatabase',
                    data: snapshot,
                    expectedVersion: databaseVersion
                }).then(result => {
                    databaseVersion = result.version;
                    return result;
                })
            );
            return saveQueue.then(result => {
                if (successMessage) showToast(successMessage);
                return result;
            }).catch(error => {
                showToast(`Gagal menyimpan data: ${error.message || 'Periksa koneksi Cloudflare dan Google Apps Script.'}`, 'error');
                throw error;
            });
        }

        function saveDatabaseAfterChange(successMessage) {
            persistDatabase(successMessage).catch(() => {});
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function renderNavigation() {
            const navMenu = document.getElementById('nav-menu');
            navMenu.innerHTML = routes.map(route => `
                <a href="#" onclick="navigate('${route.id}')" 
                   class="nav-item ${currentState.route === route.id ? 'active' : 'text-slate-600'} flex items-center gap-3 px-4 py-2.5 rounded-lg mb-1">
                    <i data-lucide="${route.icon}" class="w-5 h-5"></i>
                    <span class="font-medium text-sm">${route.label}</span>
                </a>
            `).join('');
        }

        function navigate(route) {
            currentState.route = route;
            renderNavigation();
            const mainContent = document.getElementById('main-content');
            mainContent.innerHTML = '<div class="flex justify-center items-center h-full"><i data-lucide="loader-2" class="w-8 h-8 animate-spin text-primary-500"></i></div>';
            lucide.createIcons();
            
            // Mobile auto-close sidebar
            if(window.innerWidth < 768 && !document.getElementById('sidebar').classList.contains('-translate-x-full')) {
                toggleSidebar();
            }

            // Simulate slight load time for smoothness
            setTimeout(() => {
                switch(route) {
                    case 'dashboard': mainContent.innerHTML = renderDashboard(); break;
                    case 'students': mainContent.innerHTML = renderStudents(); break;
                    case 'tutors': mainContent.innerHTML = renderTutors(); break;
                    case 'schedules': mainContent.innerHTML = renderSchedules(); break;
                    case 'journals': mainContent.innerHTML = renderJournals(); break;
                    case 'finance': mainContent.innerHTML = renderFinance(); break;
                    case 'wa_reports': mainContent.innerHTML = renderWAReports(); break;
                    default: 
                        mainContent.innerHTML = `
                            <div class="flex flex-col items-center justify-center h-full text-slate-400 fade-in">
                                <i data-lucide="hammer" class="w-16 h-16 mb-4 opacity-50"></i>
                                <h2 class="text-xl font-semibold text-slate-700">Modul Sedang Dikembangkan</h2>
                                <p class="text-sm mt-2">Sesuai PRD, modul ini masuk dalam prioritas berikutnya.</p>
                            </div>
                        `;
                }
                lucide.createIcons();
            }, 100);
        }

        // --- Views ---

        function renderDashboard() {
            const todaySchedules = db.schedules.filter(s => s.date === '2026-11-11');
            const pendingReports = db.waReports.filter(r => r.status === 'Menunggu Persetujuan').length;

            return `
                <div class="fade-in max-w-7xl mx-auto">
                    <div class="mb-6">
                        <h1 class="text-2xl font-bold text-slate-800">Ringkasan Operasional</h1>
                        <p class="text-slate-500 text-sm mt-1">Pantau aktivitas bimbel hari ini, Rabu 11 November 2026.</p>
                    </div>

                    <!-- KPI Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        ${kpiCard('Siswa Aktif', db.students.length, 'users', 'bg-blue-100 text-blue-600')}
                        ${kpiCard('Tentor Aktif', db.tutors.length, 'user-check', 'bg-emerald-100 text-emerald-600')}
                        ${kpiCard('Jadwal Hari Ini', todaySchedules.length, 'calendar', 'bg-purple-100 text-purple-600')}
                        ${kpiCard('Laporan Pending', pendingReports, 'message-circle-warning', 'bg-amber-100 text-amber-600')}
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Jadwal Hari Ini -->
                        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
                                <h2 class="font-semibold text-slate-800">Jadwal Hari Ini</h2>
                                <button onclick="navigate('schedules')" class="text-sm text-primary-600 font-medium hover:underline">Lihat Semua</button>
                            </div>
                            <div class="p-0">
                                <table class="w-full text-sm text-left">
                                    <thead class="bg-slate-50 text-slate-500">
                                        <tr>
                                            <th class="px-5 py-3 font-medium">Waktu</th>
                                            <th class="px-5 py-3 font-medium">Program</th>
                                            <th class="px-5 py-3 font-medium">Siswa/Kelas</th>
                                            <th class="px-5 py-3 font-medium">Tentor</th>
                                            <th class="px-5 py-3 font-medium">Status</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${todaySchedules.map(s => {
                                            const studentNames = s.studentIds.map(id => db.students.find(st => st.id === id).name).join(', ');
                                            const tutor = db.tutors.find(t => t.id === s.tutorId).name;
                                            return `
                                            <tr class="hover:bg-slate-50">
                                                <td class="px-5 py-3 font-medium">${s.startTime} - ${s.endTime}</td>
                                                <td class="px-5 py-3"><span class="px-2 py-1 bg-slate-100 rounded text-xs">${s.type}</span></td>
                                                <td class="px-5 py-3">${studentNames} <br><span class="text-xs text-slate-400">${s.subject}</span></td>
                                                <td class="px-5 py-3">${tutor}</td>
                                                <td class="px-5 py-3">${statusBadge(s.status)}</td>
                                            </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Aktivitas Terkini -->
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="px-5 py-4 border-b border-slate-100">
                                <h2 class="font-semibold text-slate-800">Tugas & Notifikasi</h2>
                            </div>
                            <div class="p-5 space-y-4">
                                ${pendingReports > 0 ? `
                                <div class="flex gap-3">
                                    <div class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0">
                                        <i data-lucide="clipboard-check" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">Persetujuan Laporan WA</p>
                                        <p class="text-xs text-slate-500 mt-0.5">Ada ${pendingReports} jurnal yang menunggu diperiksa sebelum dikirim ke orang tua.</p>
                                        <button onclick="navigate('wa_reports')" class="mt-2 text-xs font-medium text-primary-600 border border-primary-200 rounded px-2 py-1 hover:bg-primary-50">Periksa Sekarang</button>
                                    </div>
                                </div>` : ''}
                                <div class="flex gap-3">
                                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                                        <i data-lucide="wallet" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-medium text-slate-800">Tagihan Jatuh Tempo</p>
                                        <p class="text-xs text-slate-500 mt-0.5">2 tagihan siswa jatuh tempo besok.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStudents() {
            return `
                <div class="fade-in max-w-7xl mx-auto h-full flex flex-col">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800">Data Siswa</h1>
                            <p class="text-slate-500 text-sm mt-1">Kelola data murid, orang tua, dan program belajar.</p>

                            <i data-lucide="plus" class="w-4 h-4"></i> Tambah Siswa
                        </button>
                    </div>

                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-1 overflow-hidden flex flex-col">
                        <div class="p-4 border-b border-slate-100 flex gap-3">
                            <div class="relative flex-1 max-w-md">
                                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                <input type="text" placeholder="Cari nama atau kode siswa..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none">
                            </div>
                            <select class="border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-primary-500">
                                <option>Semua Program</option>
                                <option>Privat</option>
                                <option>Kelompok</option>
                            </select>
                        </div>
                        <div class="flex-1 overflow-auto">
                            <table class="w-full text-sm text-left whitespace-nowrap">
                                <thead class="bg-slate-50 text-slate-500 sticky top-0 shadow-sm">
                                    <tr>
                                        <th class="px-6 py-3 font-medium">Siswa</th>
                                        <th class="px-6 py-3 font-medium">Sekolah & Kelas</th>
                                        <th class="px-6 py-3 font-medium">Orang Tua / Wali</th>
                                        <th class="px-6 py-3 font-medium">Program</th>
                                        <th class="px-6 py-3 font-medium">Status</th>
                                        <th class="px-6 py-3 font-medium text-right">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${db.students.map(s => `
                                        <tr class="hover:bg-slate-50 transition-colors">
                                            <td class="px-6 py-4">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center font-bold text-slate-600">
                                                        ${s.name.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <p class="font-semibold text-slate-800">${s.name}</p>
                                                        <p class="text-xs text-slate-500">${s.code}</p>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-6 py-4">
                                                <p class="text-slate-800">${s.school}</p>
                                                <p class="text-xs text-slate-500">Kelas ${s.grade}</p>
                                            </td>
                                            <td class="px-6 py-4">
                                                <p class="text-slate-800">${s.parentName}</p>
                                                <div class="flex items-center gap-1 text-xs text-slate-500 mt-0.5">
                                                    <i data-lucide="phone" class="w-3 h-3"></i> ${s.phone}
                                                </div>
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md text-xs font-medium border border-slate-200">${s.program}</span>
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">
                                                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> ${s.status}
                                                </span>
                                            </td>

        function statusBadge(status) {
            let colors = '';
            switch(status) {
                case 'Aktif':
                case 'Selesai': colors = 'bg-green-100 text-green-700'; break;
                case 'Berjalan': colors = 'bg-blue-100 text-blue-700'; break;
                case 'Dijadwalkan': colors = 'bg-purple-100 text-purple-700'; break;
                default: colors = 'bg-slate-100 text-slate-700';
            }
            return `<span class="px-2.5 py-1 rounded-full text-xs font-medium ${colors}">${status}</span>`;
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let icon = 'info';
            let bgColor = 'bg-blue-600';
            if (type === 'success') {
                icon = 'check-circle';
                bgColor = 'bg-slate-800';
            } else if (type === 'error') {
                icon = 'alert-circle';
                bgColor = 'bg-red-600';
            }
            
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg text-white text-sm font-medium transform transition-all duration-300 translate-y-10 opacity-0 ${bgColor}`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();
            
            // Animate in
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            
            // Animate out and remove
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-full');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        const modalContainer = document.getElementById('modal-container');

        const modalBody = document.getElementById('modal-body');
        const modalActionBtn = document.getElementById('modal-action-btn');

        function openModal(title, htmlContent, actionText, actionCallback) {
            modalTitle.innerText = title;
            modalBody.innerHTML = htmlContent;
            modalActionBtn.innerText = actionText;
            modalActionBtn.onclick = () => {
                actionCallback();
                closeModal();
            };
            
            modalContainer.classList.remove('hidden');
            // trigger reflow
            void modalContainer.offsetWidth;
            modalContainer.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            lucide.createIcons();
        }

        function closeModal() {
            modalContainer.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modalContainer.classList.add('hidden');
            }, 200);
        }

        function showAddStandaloneJournalModal() {
            const studentOptions = db.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            const tutorOptions = db.tutors.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

            const formHtml = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Siswa</label>
                            <select id="j-stand-student" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                ${studentOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tentor</label>
                            <select id="j-stand-tutor" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                ${tutorOptions}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                        <input type="text" id="j-stand-subject" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: Matematika">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Materi & Tujuan Pembelajaran</label>
                        <input type="text" id="j-stand-materi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: Pecahan sederhana">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tingkat Penguasaan</label>
                            <select id="j-stand-penguasaan" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                <option>Belum memahami</option>
                                <option>Mulai memahami</option>
                                <option>Cukup memahami</option>
                                <option>Menguasai</option>
                                <option>Sangat menguasai</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nilai Evaluasi (0-100)</label>
                            <input type="number" id="j-stand-nilai" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" value="80">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Catatan Perkembangan & Kendala</label>
                        <textarea id="j-stand-catatan" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Siswa sudah mampu... perlu ditingkatkan bagian..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Rekomendasi / Latihan Mandiri</label>
                        <input type="text" id="j-stand-rekomendasi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Latihan soal halaman...">
                    </div>
                </div>
            `;

            openModal('Tambah Jurnal & Capaian Manual', formHtml, 'Simpan Jurnal', () => {
                const studentId = parseInt(document.getElementById('j-stand-student').value);
                const tutorId = parseInt(document.getElementById('j-stand-tutor').value);
                const subject = document.getElementById('j-stand-subject').value || 'Materi Umum';
                
                // Membuat jadwal dummy agar riwayat bisa di-render dengan seragam sesuai relasi database
                const newSchedId = db.schedules.length + 1;
                const today = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
                
                db.schedules.unshift({
                    id: newSchedId,
                    date: today,
                    startTime: '00:00',
                    endTime: '00:00',
                    tutorId: tutorId,
                    studentIds: [studentId],
                    subject: subject,
                    type: 'Tambahan Manual',
                    status: 'Selesai',
                    hasJournal: true
                });

                const newJournalId = db.journals.length + 1;
                db.journals.unshift({
                    id: newJournalId,
                    scheduleId: newSchedId,
                    studentId: studentId,
                    tutorId: tutorId,
                    material: document.getElementById('j-stand-materi').value || 'Materi Pembelajaran',
                    mastery: document.getElementById('j-stand-penguasaan').value,
                    notes: document.getElementById('j-stand-catatan').value || '-',
                    recommendation: document.getElementById('j-stand-rekomendasi').value || '-',
                    score: document.getElementById('j-stand-nilai').value || 0
                });
                
                // Hitung Earning Tentor otomatis berdasarkan aturan fee (Simulasi Sederhana PRD)
                const tutor = db.tutors.find(t => t.id === tutorId);
                let earning = 0;
                if(tutor && tutor.feeRules) {
                    if(tutor.feeRules.type === 'Per Pertemuan' || tutor.feeRules.type === 'Per Siswa' || tutor.feeRules.type === 'Per Jam') {
                        earning = tutor.feeRules.value; // Simulasi per sesi saja untuk demo ini
                    }
                }
                if(earning > 0) {
                    db.tutorEarnings.push({
                        id: db.tutorEarnings.length + 1,
                        tutorId: tutorId,
                        scheduleId: newSchedId,
                        amount: earning,
                        status: 'Pending',
                        date: today
                    });
                }

                saveDatabaseAfterChange('Jurnal belajar manual berhasil disimpan.');
                if(currentState.route === 'journals') navigate('journals');
            });
        }

        function showAddInvoiceModal() {
            const studentOptions = db.students.map(s => `<option value="${s.id}">${s.name} (${s.code})</option>`).join('');
            
            const formHtml = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Siswa</label>
                        <select id="inv-student" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                            ${studentOptions}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nominal Tagihan (Rp)</label>
                        <input type="number" id="inv-amount" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: 500000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jatuh Tempo</label>
                        <input type="date" id="inv-due" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                    </div>
                </div>
            `;

            openModal('Buat Tagihan Baru', formHtml, 'Buat Tagihan', () => {
                const studentId = parseInt(document.getElementById('inv-student').value);
                const amount = parseInt(document.getElementById('inv-amount').value) || 0;
                const due = document.getElementById('inv-due').value;

                if(!amount || !due) {
                    showToast('Harap isi nominal dan tanggal jatuh tempo', 'error');
                    modalContainer.classList.remove('hidden');
                    return;
                }

                const invoiceNo = `INV-2611-00${db.invoices.length + 1}`;

                db.invoices.unshift({
                    id: db.invoices.length + 1,
                    studentId: studentId,
                    invoiceNumber: invoiceNo,
                    amount: amount,
                    dueDate: due,
                    status: 'Belum Lunas'
                });

                saveDatabaseAfterChange(`Tagihan ${invoiceNo} berhasil disimpan.`);
                if(currentState.route === 'finance') navigate('finance');
            });
        }

        function showPayInvoiceModal(invoiceId) {
            const invoice = db.invoices.find(i => i.id === invoiceId);
            const student = db.students.find(s => s.id === invoice.studentId);
            
            const html = `
                <div class="text-center space-y-4 py-4">
                    <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-2">
                        <i data-lucide="check-circle" class="w-8 h-8"></i>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800">Konfirmasi Pembayaran</h3>
                    <p class="text-sm text-slate-500">Anda akan menandai tagihan <b>${invoice.invoiceNumber}</b> atas nama <b>${student.name}</b> sebesar <b class="text-slate-700">Rp ${invoice.amount.toLocaleString('id-ID')}</b> menjadi status <b>LUNAS</b>.</p>
                    <div class="bg-amber-50 border border-amber-200 text-amber-700 text-xs p-3 rounded-lg flex gap-2 text-left mt-4">
                        <i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i>
                        <p>Pastikan Anda telah menerima dana pembayaran yang sesuai sebelum melanjutkan aksi ini.</p>
                    </div>
                </div>
            `;
            
            openModal('Pelunasan Tagihan', html, 'Ya, Tandai Lunas', () => {
                invoice.status = 'Lunas';
                saveDatabaseAfterChange(`Pembayaran tagihan ${invoice.invoiceNumber} berhasil disimpan.`);
                if(currentState.route === 'finance') navigate('finance');
            });
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
