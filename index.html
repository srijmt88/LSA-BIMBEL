                    return false;
                }
                const tutor = db.tutors.find(item => String(item.id) === String(values.tutorId));
                if (tutor?.feeRules?.type === 'Persentase' &&
                    (!Number.isSafeInteger(values.manualTutorFee) || values.manualTutorFee <= 0)) {
                    showToast('Masukkan honor manual per sesi untuk fee tentor Persentase.', 'error');
                    return false;
                }

                const conflicts = getScheduleConflicts(generated.dates);
                if (conflicts.length && !window.confirm(`Bentrok jadwal ditemukan:\n\n${conflicts.join('\n')}\n\nTetap simpan jadwal?`)) {
                    return false;
                }

                const firstId = nextRecordId(db.schedules);
                const recurrenceId = recurring ? createReceiptNumber('REC', firstId) : '';
                try {
                    const newSchedules = generated.dates.map((candidate, index) => ({
                        id: firstId + index,
                        date: candidate.date,
                        startTime: values.startTime,
                        endTime: values.endTime,
                        tutorId: values.tutorId,
                        studentIds: [values.studentId],
                        subject: values.subject,
                        type: values.type,
                        room: values.room,
                        status: 'Dijadwalkan',
                        hasJournal: false,
                        attendanceToken: generateAttendanceToken(),
                        attendanceRecords: [],
                        rescheduleHistory: [],
                        manualTutorFee: tutor?.feeRules?.type === 'Persentase' ? values.manualTutorFee : 0,
                        recurrenceId: recurrenceId || null,
                        recurrence: recurring ? {
                            weekdays: values.weekdays.map(Number),
                            startDate: values.date,
                            endDate: values.repeatUntil
                        } : null
                    }));
                    db.schedules.push(...newSchedules);
                } catch (error) {
                    showToast(error.message || 'Token presensi gagal dibuat.', 'error');
                    return false;
                }

                selectedScheduleDate = generated.dates[0].date;
                saveDatabaseAfterChange(`${generated.dates.length} jadwal berhasil disimpan.`);
                if (currentState.route === 'schedules') navigate('schedules');
            });
            updateScheduleHonorField();
            updateScheduleConflictPreview();
        }

        function createTutorEarningForSchedule(schedule) {
            if (db.tutorEarnings.some(earning => String(earning.scheduleId) === String(schedule.id))) return null;
            const tutor = db.tutors.find(item => String(item.id) === String(schedule.tutorId));
            if (!tutor?.feeRules) return null;

            const rule = tutor.feeRules;
            const studentAttendanceCount = (Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : [])
                .filter(record => record.participantType === 'student' && record.checkInAt).length;
            const start = schedule.actualStartAt ? new Date(schedule.actualStartAt) : null;
            const end = schedule.actualEndAt ? new Date(schedule.actualEndAt) : null;
            let amount = 0;
            if (rule.type === 'Persentase') {
                amount = Number(schedule.manualTutorFee) || 0;
            } else if (rule.type === 'Per Pertemuan') {
                amount = Number(rule.value) || 0;
            } else if (rule.type === 'Per Siswa') {
                amount = (Number(rule.value) || 0) * studentAttendanceCount;
            } else if (rule.type === 'Per Jam' && start && end && end > start) {
                amount = Math.round((Number(rule.value) || 0) * (end.getTime() - start.getTime()) / 3600000);
            }
            if (!Number.isSafeInteger(amount) || amount <= 0) return null;

            const earning = {
                id: nextRecordId(db.tutorEarnings),
                tutorId: schedule.tutorId,
                scheduleId: schedule.id,
                amount,
                paidAmount: 0,
                status: 'Pending',
                date: schedule.date,
                actualStartAt: schedule.actualStartAt || null,
                actualEndAt: schedule.actualEndAt || null,
                attendanceCount: studentAttendanceCount
            };
            db.tutorEarnings.push(earning);
            return earning;
        }

        function getCheckedInStudents(schedule) {
            const attendanceRecords = Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : [];
            return (schedule.studentIds || [])
                .filter(studentId => attendanceRecords.some(record =>
                    record.participantType === 'student' &&
                    String(record.participantId) === String(studentId) &&
                    record.checkInAt
                ))
                .map(studentId => db.students.find(student => String(student.id) === String(studentId)))
                .filter(Boolean);
        }

        function saveScheduleLearningJournal(schedule, material, evaluations) {
            const checkedInStudents = getCheckedInStudents(schedule);
            const evaluationByStudent = new Map(evaluations.map(item => [String(item.studentId), item.notes.trim()]));
            schedule.lessonMaterial = material.trim();
            checkedInStudents.forEach(student => {
                const notes = evaluationByStudent.get(String(student.id));
                if (!notes) throw new Error(`Evaluasi ${student.name} wajib diisi sebelum sesi selesai.`);
                let journal = db.journals.find(item =>
                    String(item.scheduleId) === String(schedule.id) &&
                    String(item.studentId) === String(student.id)
                );
                if (!journal) {
                    journal = {
                        id: nextRecordId(db.journals),
                        scheduleId: schedule.id,
                        studentId: student.id,
                        tutorId: schedule.tutorId,
                        date: schedule.date
                    };
                    db.journals.push(journal);
                }
                journal.material = material.trim();
                journal.notes = notes;
                journal.mastery = journal.mastery || 'Catatan tentor';
                journal.recommendation = journal.recommendation || '';
                journal.score = journal.score == null ? '' : journal.score;
                journal.createdAt = journal.createdAt || new Date().toISOString();
                ensureDailyWAReport(student, schedule.date, journal.id);
            });
            (schedule.studentIds || []).forEach(studentId => {
                const student = db.students.find(item => String(item.id) === String(studentId));
                if (student) ensureDailyWAReport(student, schedule.date);
            });
            schedule.hasJournal = checkedInStudents.length > 0;
            return checkedInStudents.length;
        }

        function ensureDailyWAReport(student, date, journalId) {
            let report = db.waReports.find(item =>
                String(item.studentId) === String(student.id) &&
                String(item.date || item.reportDate || '') === String(date)
            );
            if (!report && journalId != null) {
                report = db.waReports.find(item => String(item.journalId) === String(journalId));
            }
            if (!report) {
                report = {
                    id: nextRecordId(db.waReports),
                    studentId: student.id,
                    date,
                    journalIds: [],
                    status: 'Menunggu Persetujuan'
                };
                db.waReports.push(report);
            }
            report.studentId = student.id;
            report.date = date;
            report.journalIds = Array.isArray(report.journalIds) ? report.journalIds : [];
            if (report.journalId != null && !report.journalIds.some(id => String(id) === String(report.journalId))) {
                report.journalIds.push(report.journalId);
            }
            if (journalId != null && !report.journalIds.some(id => String(id) === String(journalId))) {
                report.journalIds.push(journalId);
            }
            report.journalId = report.journalIds[0] == null ? null : report.journalIds[0];
            if (report.status === 'Terkirim') {
                report.status = 'Menunggu Persetujuan';
                delete report.sentAt;
            }
        }

        function getMonthEndDate(month) {
            const [year, monthNumber] = month.split('-').map(Number);
            const lastDay = new Date(Date.UTC(year, monthNumber, 0)).getUTCDate();
            return `${year}-${String(monthNumber).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
        }

        function createMonthlyInvoicesForSchedule(schedule) {
            const billingMonth = String(schedule.date).slice(0, 7);
            const dueDate = getMonthEndDate(billingMonth);
            const result = { created: 0, missingTariff: [] };
            (schedule.studentIds || []).forEach(studentId => {
                const student = db.students.find(item => String(item.id) === String(studentId));
                if (!student || student.status !== 'Aktif') return;
                const amount = Number(student.monthlyFee);
                if (!Number.isSafeInteger(amount) || amount <= 0) {
                    result.missingTariff.push(student.name);
                    return;
                }
                const alreadyInvoiced = db.invoices.some(invoice =>
                    String(invoice.studentId) === String(student.id) &&
                    (invoice.billingMonth === billingMonth ||
                     String(invoice.dueDate || '').slice(0, 7) === billingMonth)
                );
                if (alreadyInvoiced) return;
                const invoiceId = nextRecordId(db.invoices);
                db.invoices.unshift({
                    id: invoiceId,
                    studentId: student.id,
                    invoiceNumber: createReceiptNumber('INV', invoiceId),
                    amount,
                    paidAmount: 0,
                    dueDate,
                    billingMonth,
                    description: `Biaya belajar bulanan ${billingMonth}`,
                    status: 'Belum Lunas'
                });
                result.created++;
            });
            return result;
        }

        function setScheduleStatus(schedule, nextStatus, timestamp) {
            schedule.status = nextStatus;
            if (nextStatus === 'Berjalan') {
                schedule.ownerMarkedStartAt = timestamp;
            }
            if (nextStatus === 'Selesai') {
                schedule.actualEndAt = timestamp;
                schedule.actualEndTime = new Date(timestamp).toLocaleTimeString('id-ID', {
                    hour: '2-digit', minute: '2-digit', hour12: false
                });
            }
        }

        function startScheduleManually(scheduleId) {
            const schedule = db.schedules.find(item => String(item.id) === String(scheduleId));
            if (!schedule || schedule.status !== 'Dijadwalkan') return;
            setScheduleStatus(schedule, 'Berjalan', new Date().toISOString());
            saveDatabaseAfterChange('Sesi ditandai sedang berjalan.');
            navigate('schedules');
        }

        function completeScheduleManually(scheduleId) {
            const schedule = db.schedules.find(item => String(item.id) === String(scheduleId));
            if (!schedule || schedule.status !== 'Berjalan') return;
            const tutorAttendance = (Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : []).find(record =>
                record.participantType === 'tutor' && record.checkInAt
            );
            if (!tutorAttendance) {
                showToast('Sesi belum dapat diselesaikan: presensi check-in tentor belum tervalidasi.', 'error');
                return;
            }
            const students = getCheckedInStudents(schedule);
            const evaluationFields = students.map(student => `
                <div>
                    <label for="complete-evaluation-${escapeHtml(student.id)}" class="block text-sm font-medium text-slate-700 mb-1">Evaluasi ${escapeHtml(student.name)}</label>
                    <textarea id="complete-evaluation-${escapeHtml(student.id)}" data-student-id="${escapeHtml(student.id)}" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Catatan perkembangan siswa"></textarea>
                </div>
            `).join('');
            openModal('Jurnal & Selesaikan Sesi', `
                <div class="space-y-4">
                    <div>
                        <label for="complete-material" class="block text-sm font-medium text-slate-700 mb-1">Materi / bab yang diajarkan</label>
                        <textarea id="complete-material" rows="2" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" placeholder="Ringkas materi sesi"></textarea>
                    </div>
                    ${evaluationFields || '<p class="text-sm text-slate-500">Tidak ada siswa yang check-in; materi sesi tetap wajib dicatat.</p>'}
                    <p class="text-xs text-slate-500">Jam pulang akan dicatat saat owner menyimpan dan sesi diselesaikan.</p>
                </div>
            `, 'Simpan Jurnal & Selesaikan', () => {
                const material = document.getElementById('complete-material').value.trim();
                const evaluations = Array.from(document.querySelectorAll('#modal-body textarea[data-student-id]'))
                    .map(input => ({ studentId: Number(input.dataset.studentId), notes: input.value.trim() }));
                if (!material || evaluations.some(item => !item.notes)) {
                    showToast('Isi materi dan evaluasi semua siswa yang hadir.', 'error');
                    return false;
                }
                try {
                    saveScheduleLearningJournal(schedule, material, evaluations);
                } catch (error) {
                    showToast(error.message, 'error');
                    return false;
                }
                setScheduleStatus(schedule, 'Selesai', new Date().toISOString());
                const earning = createTutorEarningForSchedule(schedule);
                const invoices = createMonthlyInvoicesForSchedule(schedule);
                const messages = ['Sesi dan jurnal berhasil diselesaikan.'];
                if (earning) messages.push(`Honor ${formatRupiah(earning.amount)} tercatat.`);
                if (invoices.created) messages.push(`${invoices.created} tagihan bulanan dibuat.`);
                if (invoices.missingTariff.length) messages.push(`Tarif belum diatur: ${invoices.missingTariff.join(', ')}.`);
                saveDatabaseAfterChange(messages.join(' '));
                navigate('schedules');
            });
        }

        function cancelSchedule(scheduleId) {
            const schedule = db.schedules.find(item => String(item.id) === String(scheduleId));
            if (!schedule || !['Dijadwalkan', 'Berjalan'].includes(schedule.status)) return;
            const tutorHasCheckedIn = (Array.isArray(schedule.attendanceRecords) ? schedule.attendanceRecords : []).some(record =>
                record.participantType === 'tutor' && record.checkInAt
            );
            if (schedule.status === 'Berjalan' && tutorHasCheckedIn) {
                showToast('Sesi yang sudah dihadiri tentor harus diselesaikan agar jam dan honor tercatat.', 'error');
                return;
            }
            const reason = window.prompt('Masukkan alasan pembatalan jadwal:');
            if (reason === null) return;
            if (!reason.trim()) {
                showToast('Alasan pembatalan wajib diisi.', 'error');
                return;
            }
            if (!window.confirm('Batalkan sesi ini? Sesi yang dibatalkan tidak menghasilkan honor.')) return;

            schedule.status = 'Batal';
            schedule.cancellationReason = reason.trim();
            schedule.cancelledAt = new Date().toISOString();
            saveDatabaseAfterChange('Jadwal berhasil dibatalkan.');
            navigate('schedules');
        }

        function showRescheduleModal(scheduleId) {
            const schedule = db.schedules.find(item => String(item.id) === String(scheduleId));
            if (!schedule || schedule.status !== 'Dijadwalkan') return;
            const formHtml = `
                <div class="space-y-4">
                    <p class="text-sm text-slate-500">Jadwal saat ini: ${escapeHtml(formatScheduleDate(schedule.date))}, ${escapeHtml(schedule.startTime)}-${escapeHtml(schedule.endTime)}</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div>

            `;
            openModal('Reschedule Sesi', formHtml, 'Simpan Perubahan', () => {

                const room = document.getElementById('reschedule-room').value.trim();
                const reason = document.getElementById('reschedule-reason').value.trim();
                if (!date || !startTime || !endTime || endTime <= startTime || !reason) {
                    showToast('Tanggal, rentang waktu yang valid, dan alasan reschedule wajib diisi.', 'error');
                    return false;
                }
                const proposed = [{
                    date, startTime, endTime, room,
                    tutorId: schedule.tutorId,

                }];
                const conflicts = getScheduleConflicts(proposed, schedule.id);
                if (conflicts.length && !window.confirm(`Bentrok jadwal ditemukan:\n\n${conflicts.join('\n')}\n\nTetap reschedule?`)) {
                    return false;
                }
                const newAttendanceToken = generateAttendanceToken();
                schedule.rescheduleHistory = Array.isArray(schedule.rescheduleHistory) ? schedule.rescheduleHistory : [];
                schedule.rescheduleHistory.push({
                    oldDate: schedule.date,
                    oldStartTime: schedule.startTime,
                    oldEndTime: schedule.endTime,
                    newDate: date,
                    newStartTime: startTime,
                    newEndTime: endTime,
                    reason,
                    changedAt: new Date().toISOString()
                });
                schedule.date = date;
                schedule.startTime = startTime;
                schedule.endTime = endTime;
                schedule.room = room;
                schedule.attendanceToken = newAttendanceToken;
                selectedScheduleDate = date;
                saveDatabaseAfterChange('Jadwal berhasil dipindahkan. Token presensi lama tidak berlaku.');
                navigate('schedules');

                    recommendation: document.getElementById('j-rekomendasi').value,

                };
                db.journals.push(newJournal);

                ensureDailyWAReport(student, sched.date, newJournal.id);
                sched.hasJournal = true;
                sched.lessonMaterial = newJournal.material;
                const invoices = createMonthlyInvoicesForSchedule(sched);

                saveDatabaseAfterChange(invoices.created
                    ? `Jurnal dan laporan harian tersimpan; ${invoices.created} tagihan bulanan dibuat.`
                    : invoices.missingTariff
                        ? 'Jurnal dan laporan harian tersimpan. Atur tarif siswa untuk membuat invoice.'
                        : 'Jurnal dan laporan harian berhasil disimpan.');
                if(currentState.route === 'schedules') navigate('schedules');
            });
        }

        function showAddStandaloneJournalModal() {
            const studentOptions = db.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            const tutorOptions = db.tutors.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

            const formHtml = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Siswa</label>
                            <select id="j-stand-student" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                ${studentOptions}
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tentor</label>
                            <select id="j-stand-tutor" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                ${tutorOptions}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Mata Pelajaran</label>
                        <input type="text" id="j-stand-subject" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: Matematika">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Materi & Tujuan Pembelajaran</label>
                        <input type="text" id="j-stand-materi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: Pecahan sederhana">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tingkat Penguasaan</label>
                            <select id="j-stand-penguasaan" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                                <option>Belum memahami</option>
                                <option>Mulai memahami</option>
                                <option>Cukup memahami</option>
                                <option>Menguasai</option>
                                <option>Sangat menguasai</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Nilai Evaluasi (0-100)</label>
                            <input type="number" id="j-stand-nilai" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" value="80">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Catatan Perkembangan & Kendala</label>
                        <textarea id="j-stand-catatan" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Siswa sudah mampu... perlu ditingkatkan bagian..."></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Rekomendasi / Latihan Mandiri</label>
                        <input type="text" id="j-stand-rekomendasi" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Latihan soal halaman...">
                    </div>
                </div>
            `;

            openModal('Tambah Jurnal & Capaian Manual', formHtml, 'Simpan Jurnal', () => {
                const studentId = parseInt(document.getElementById('j-stand-student').value);
                const tutorId = parseInt(document.getElementById('j-stand-tutor').value);
                const subject = document.getElementById('j-stand-subject').value || 'Materi Umum';
                
                // Membuat jadwal dummy agar riwayat bisa di-render dengan seragam sesuai relasi database
                const newSchedId = nextRecordId(db.schedules);
                const today = new Date().toISOString().split('T')[0]; // Format YYYY-MM-DD
                
                db.schedules.unshift({
                    id: newSchedId,
                    date: today,
                    startTime: '00:00',
                    endTime: '00:00',
                    tutorId: tutorId,
                    studentIds: [studentId],
                    subject: subject,
                    type: 'Tambahan Manual',
                    status: 'Selesai',
                    hasJournal: true
                });

                const newJournal = {
                    id: nextRecordId(db.journals),
                    scheduleId: newSchedId,
                    studentId: studentId,
                    tutorId: tutorId,
                    date: today,
                    material: document.getElementById('j-stand-materi').value || 'Materi Pembelajaran',
                    mastery: document.getElementById('j-stand-penguasaan').value,
                    notes: document.getElementById('j-stand-catatan').value || '-',
                    recommendation: document.getElementById('j-stand-rekomendasi').value || '-',
                    score: document.getElementById('j-stand-nilai').value || 0
                };
                db.journals.unshift(newJournal);
                const student = db.students.find(item => String(item.id) === String(studentId));
                if (student) ensureDailyWAReport(student, today, newJournal.id);
                
                // Hitung Earning Tentor otomatis berdasarkan aturan fee (Simulasi Sederhana PRD)
                const tutor = db.tutors.find(t => t.id === tutorId);
                let earning = 0;
                if(tutor && tutor.feeRules) {
                    if(tutor.feeRules.type === 'Per Pertemuan' || tutor.feeRules.type === 'Per Siswa' || tutor.feeRules.type === 'Per Jam') {
                        earning = tutor.feeRules.value; // Simulasi per sesi saja untuk demo ini
                    }
                }
                if(earning > 0) {
                    db.tutorEarnings.push({
                        id: db.tutorEarnings.length + 1,
                        tutorId: tutorId,
                        scheduleId: newSchedId,
                        amount: earning,
                        status: 'Pending',
                        date: today
                    });
                }

                const invoices = createMonthlyInvoicesForSchedule(db.schedules.find(item => String(item.id) === String(newSchedId)));
                saveDatabaseAfterChange(invoices.created
                    ? `Jurnal berhasil disimpan dan ${invoices.created} tagihan bulanan dibuat.`
                    : invoices.missingTariff
                        ? 'Jurnal berhasil disimpan. Atur tarif bulanan siswa untuk membuat invoice otomatis.'
                        : 'Jurnal belajar manual berhasil disimpan.');
                if(currentState.route === 'journals') navigate('journals');
            });
        }

        function showAddInvoiceModal() {
            if (!db.students.length) {
                showToast('Tambahkan data siswa sebelum membuat tagihan.', 'error');
                return;
            }
            const studentOptions = db.students.map(s =>
                `<option value="${s.id}">${escapeHtml(s.name)} (${escapeHtml(s.code)})</option>`
            ).join('');
            
            const formHtml = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Siswa</label>
                        <select id="inv-student" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                            ${studentOptions}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nominal Tagihan (Rp)</label>
                        <input type="number" id="inv-amount" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500" placeholder="Contoh: 500000">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jatuh Tempo</label>
                        <input type="date" id="inv-due" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-primary-500 bg-white">
                    </div>
                </div>
            `;

            openModal('Buat Tagihan Baru', formHtml, 'Buat Tagihan', () => {
                const studentId = Number(document.getElementById('inv-student').value);
                const amount = Number(document.getElementById('inv-amount').value);
                const due = document.getElementById('inv-due').value;

                if (!Number.isSafeInteger(amount) || amount <= 0 || !due) {
                    showToast('Isi nominal tagihan yang valid dan tanggal jatuh tempo.', 'error');
                    return false;
                }

                const invoiceId = nextRecordId(db.invoices);
                const invoiceNo = createReceiptNumber('INV', invoiceId);

                db.invoices.unshift({
                    id: invoiceId,
                    studentId: studentId,
                    invoiceNumber: invoiceNo,
                    amount: amount,
                    paidAmount: 0,
                    dueDate: due,
                    status: 'Belum Lunas'
                });

                saveDatabaseAfterChange(`Tagihan ${invoiceNo} berhasil disimpan.`);
                if(currentState.route === 'finance') navigate('finance');
            });
        }

        function showStudentPaymentModal(invoiceId) {
            const openInvoices = db.invoices.filter(invoice => getInvoiceRemaining(invoice) > 0);
            if (!openInvoices.length) {
                showToast('Tidak ada tagihan siswa yang belum lunas.', 'error');
                return;
            }

            const selectedId = invoiceId == null ? openInvoices[0].id : invoiceId;
            const invoiceOptions = openInvoices.map(invoice => {
                const student = db.students.find(item => item.id === invoice.studentId) || { name: 'Siswa tidak ditemukan' };
                const selected = String(invoice.id) === String(selectedId) ? 'selected' : '';
                return `<option value="${invoice.id}" ${selected}>${escapeHtml(student.name)} - ${escapeHtml(invoice.invoiceNumber)} (sisa ${escapeHtml(formatRupiah(getInvoiceRemaining(invoice)))})</option>`;
            }).join('');

            openModal('Catat Pemasukan Siswa', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Siswa / Tagihan</label>
                        <select id="pay-invoice-select" onchange="updateStudentPaymentPreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                            ${invoiceOptions}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div class="rounded-lg bg-slate-50 p-3"><p class="text-slate-500">Total tagihan</p><p id="pay-billed" class="font-semibold mt-1"></p></div>
                        <div class="rounded-lg bg-green-50 p-3"><p class="text-slate-500">Sudah dibayar</p><p id="pay-paid-before" class="font-semibold text-green-700 mt-1"></p></div>
                    </div>
                    <div>
                        <label for="pay-amount" class="block text-sm font-medium text-slate-700 mb-1">Dibayar sekarang (Rp)</label>
                        <input id="pay-amount" type="number" min="1" step="1" oninput="updateStudentPaymentPreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required>
                    </div>
                    <div class="rounded-lg bg-amber-50 border border-amber-200 p-3 text-sm">
                        <span class="text-slate-600">Kurang bayar setelah transaksi:</span>
                        <strong id="pay-remaining-after" class="block mt-1 text-amber-800"></strong>
                    </div>
                </div>
            `, 'Simpan & Buat Bukti', () => {
                const invoice = db.invoices.find(item => String(item.id) === document.getElementById('pay-invoice-select').value);
                const amount = Number(document.getElementById('pay-amount').value);
                const remaining = invoice ? getInvoiceRemaining(invoice) : 0;
                if (!invoice || !Number.isSafeInteger(amount) || amount <= 0 || amount > remaining) {
                    showToast('Nominal pembayaran harus lebih dari 0 dan tidak boleh melebihi sisa tagihan.', 'error');
                    return false;
                }

                const student = db.students.find(item => item.id === invoice.studentId);
                if (!student) {
                    showToast('Data siswa pada tagihan tidak ditemukan.', 'error');
                    return false;
                }

                const paymentId = nextRecordId(db.payments);
                const paidBefore = getInvoicePaidAmount(invoice);
                const payment = {
                    id: paymentId,
                    receiptNumber: createReceiptNumber('BKM', paymentId),
                    invoiceId: invoice.id,
                    invoiceNumber: invoice.invoiceNumber,
                    studentId: student.id,
                    studentName: student.name,
                    billedAmount: Number(invoice.amount),
                    paidBefore: paidBefore,
                    amount: amount,
                    totalPaid: paidBefore + amount,
                    remainingAfter: remaining - amount,
                    date: getLocalDateString()
                };
                const previousPaidAmount = invoice.paidAmount;
                const previousStatus = invoice.status;
                db.payments.push(payment);
                invoice.paidAmount = payment.totalPaid;
                invoice.status = payment.remainingAfter === 0 ? 'Lunas' : 'Belum Lunas';

                persistDatabase(`Pembayaran ${payment.receiptNumber} berhasil dicatat.`)
                    .then(() => navigate('finance'))
                    .catch(() => {
                        db.payments = db.payments.filter(item => item.id !== paymentId);
                        if (previousPaidAmount === undefined) delete invoice.paidAmount;
                        else invoice.paidAmount = previousPaidAmount;
                        invoice.status = previousStatus;
                        navigate('finance');
                    });
            });
            updateStudentPaymentPreview();
        }

        function updateStudentPaymentPreview() {
            const select = document.getElementById('pay-invoice-select');
            const amountInput = document.getElementById('pay-amount');
            if (!select || !amountInput) return;
            const invoice = db.invoices.find(item => String(item.id) === select.value);
            if (!invoice) return;

            const paid = getInvoicePaidAmount(invoice);
            const remaining = getInvoiceRemaining(invoice);
            document.getElementById('pay-billed').textContent = formatRupiah(invoice.amount);
            document.getElementById('pay-paid-before').textContent = formatRupiah(paid);
            if (!amountInput.value) amountInput.value = String(remaining);
            const amount = Number(amountInput.value) || 0;
            const remainingAfter = remaining - amount;
            const balanceElement = document.getElementById('pay-remaining-after');
            balanceElement.textContent = remainingAfter < 0
                ? 'Pembayaran melebihi sisa tagihan'
                : formatRupiah(remainingAfter);
            balanceElement.className = `block mt-1 ${remainingAfter < 0 ? 'text-red-700' : 'text-amber-800'}`;
        }

        function getTutorPendingAmount(tutorId) {
            return db.tutorEarnings
                .filter(earning => String(earning.tutorId) === String(tutorId))
                .reduce((sum, earning) => sum + getEarningRemaining(earning), 0);
        }

        function showTutorPayoutModal(tutorId) {
            const payableTutors = db.tutors.filter(tutor => getTutorPendingAmount(tutor.id) > 0);
            if (!payableTutors.length) {
                showToast('Tidak ada honor tentor yang belum dibayar.', 'error');
                return;
            }
            const selectedId = tutorId == null || getTutorPendingAmount(tutorId) <= 0
                ? payableTutors[0].id
                : tutorId;
            const tutorOptions = payableTutors.map(tutor =>
                `<option value="${tutor.id}" ${String(tutor.id) === String(selectedId) ? 'selected' : ''}>${escapeHtml(tutor.name)} - sisa ${escapeHtml(formatRupiah(getTutorPendingAmount(tutor.id)))}</option>`
            ).join('');

            openModal('Catat Pengeluaran Honor Tentor', `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Tentor yang dibayar</label>
                        <select id="payout-tutor-select" onchange="updateTutorPayoutPreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                            ${tutorOptions}
                        </select>
                    </div>
                    <div class="rounded-lg bg-slate-50 p-3 text-sm">
                        <p class="text-slate-500">Total honor belum dibayar</p>
                        <p id="payout-due" class="font-semibold text-slate-800 mt-1"></p>
                    </div>
                    <div>
                        <label for="payout-amount" class="block text-sm font-medium text-slate-700 mb-1">Dibayarkan sekarang (Rp)</label>
                        <input id="payout-amount" type="number" min="1" step="1" oninput="updateTutorPayoutPreview()" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm" required>
                    </div>
                    <div class="rounded-lg bg-amber-50 border border-amber-200 p-3 text-sm">
                        <span class="text-slate-600">Sisa honor setelah pembayaran:</span>
                        <strong id="payout-remaining-after" class="block mt-1 text-amber-800"></strong>
                    </div>
                </div>
            `, 'Bayar & Buat Bukti', () => {
                const selectedTutorId = document.getElementById('payout-tutor-select').value;
                const tutor = db.tutors.find(item => String(item.id) === selectedTutorId);
                const amount = Number(document.getElementById('payout-amount').value);
                const due = tutor ? getTutorPendingAmount(tutor.id) : 0;
                if (!tutor || !Number.isSafeInteger(amount) || amount <= 0 || amount > due) {
                    showToast('Nominal pembayaran harus lebih dari 0 dan tidak boleh melebihi honor tertunggak.', 'error');
                    return false;
                }

                let amountToAllocate = amount;
                const earningChanges = db.tutorEarnings
                    .filter(earning => String(earning.tutorId) === String(tutor.id) && getEarningRemaining(earning) > 0)
                    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || Number(a.id) - Number(b.id))
                    .map(earning => {
                        const paidBefore = getEarningPaidAmount(earning);
                        const allocated = Math.min(getEarningRemaining(earning), amountToAllocate);
                        amountToAllocate -= allocated;
                        return {
                            earning,
                            paidBefore,
                            previousPaidAmount: earning.paidAmount,
                            previousStatus: earning.status,
                            allocated
                        };
                    })
                    .filter(change => change.allocated > 0);
                if (amountToAllocate !== 0) {
                    showToast('Data honor berubah. Muat ulang halaman dan coba kembali.', 'error');
                    return false;
                }

                const paymentId = nextRecordId(db.tutorPayments);
                const payment = {
                    id: paymentId,
                    receiptNumber: createReceiptNumber('KLR', paymentId),
                    tutorId: tutor.id,
                    tutorName: tutor.name,
                    amount: amount,
                    remainingAfter: due - amount,
                    allocations: earningChanges.map(change => ({
                        earningId: change.earning.id,
                        amount: change.allocated
                    })),
                    date: getLocalDateString()
                };
                earningChanges.forEach(change => {
                    change.earning.paidAmount = change.paidBefore + change.allocated;
                    change.earning.status = change.earning.paidAmount >= Number(change.earning.amount)
                        ? 'Paid'
                        : 'Pending';
                });
                db.tutorPayments.push(payment);

                persistDatabase(`Pembayaran honor ${tutor.name} berhasil dicatat.`)
                    .then(() => navigate('finance'))
                    .catch(() => {
                        db.tutorPayments = db.tutorPayments.filter(item => item.id !== paymentId);
                        earningChanges.forEach(change => {
                            if (change.previousPaidAmount === undefined) delete change.earning.paidAmount;
                            else change.earning.paidAmount = change.previousPaidAmount;
                            change.earning.status = change.previousStatus;
                        });
                        navigate('finance');
                    });
            });
            updateTutorPayoutPreview();
        }

        function updateTutorPayoutPreview() {
            const select = document.getElementById('payout-tutor-select');
            const amountInput = document.getElementById('payout-amount');
            if (!select || !amountInput) return;
            const due = getTutorPendingAmount(select.value);
            document.getElementById('payout-due').textContent = formatRupiah(due);
            if (!amountInput.value) amountInput.value = String(due);
            const amount = Number(amountInput.value) || 0;
            const remainingAfter = due - amount;
            const balanceElement = document.getElementById('payout-remaining-after');
            balanceElement.textContent = remainingAfter < 0
                ? 'Pembayaran melebihi honor tertunggak'
                : formatRupiah(remainingAfter);
            balanceElement.className = `block mt-1 ${remainingAfter < 0 ? 'text-red-700' : 'text-amber-800'}`;
        }

        function printStudentReceipt(paymentId) {
            const payment = db.payments.find(item => item.id === paymentId);
            if (!payment) {
                showToast('Data bukti pemasukan tidak ditemukan.', 'error');
                return;
            }
            printThermalReceipt(
                'BUKTI PEMBAYARAN SISWA',
                payment.receiptNumber,
                payment.date,
                [
                    ['Nama siswa', payment.studentName],
                    ['No. tagihan', payment.invoiceNumber],
                    ['Total tagihan', formatRupiah(payment.billedAmount)],
                    ['Pembayaran sebelumnya', formatRupiah(payment.paidBefore)],
                    ['Total sudah dibayar', formatRupiah(payment.totalPaid)]
                ],
                'Diterima',
                payment.amount,
                'Sisa tagihan',
                payment.remainingAfter
            );
        }

        function printTutorReceipt(paymentId) {
            const payment = db.tutorPayments.find(item => item.id === paymentId);
            if (!payment) {
                showToast('Data bukti pengeluaran tidak ditemukan.', 'error');
                return;
            }
            const allocationCount = Array.isArray(payment.allocations) ? payment.allocations.length : 0;
            printThermalReceipt(
                'BUKTI PEMBAYARAN HONOR TENTOR',
                payment.receiptNumber,
                payment.date,
                [
                    ['Nama tentor', payment.tutorName],
                    ['Rincian honor', allocationCount
                        ? `${allocationCount} catatan honor`
                        : 'Riwayat transaksi; alokasi sesi sudah dihapus']
                ],
                'Dibayarkan',
                payment.amount,
                'Sisa honor tertunggak',
                payment.remainingAfter
            );
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
